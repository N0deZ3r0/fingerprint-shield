<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fonts consistency check</title>
  <style>
    body { font: 13px/1.45 system-ui, sans-serif; margin: 16px; max-width: 900px; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    .sub { color: #666; margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; margin: 8px 0 14px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; font-size: 12px; }
    th { background: #f4f4f4; }
    .pass { color: #0a7; font-weight: 600; }
    .fail { color: #c22; font-weight: 600; }
    .skip { color: #a80; font-weight: 600; }
    #verdict { font-size: 15px; font-weight: 700; margin: 10px 0; }
    pre { background: #111; color: #ddd; padding: 10px; border-radius: 6px; font-size: 11px; overflow: auto; max-height: 320px; }
  </style>
</head>
<body>
<h1>Fonts consistency</h1>
<p class="sub">
  FontFaceSet.check / load, measureText width oracle, DOM width probe,
  invalid CSS must still throw (CreepJS / clean Chrome).
</p>
<div id="verdict">running…</div>
<table>
  <thead><tr><th>#</th><th>check</th><th>verdict</th><th>detail</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<pre id="dump"></pre>

<script>
const F = {
  canvas: true, audio: true, webgl: true, webrtc: true, navigator: true,
  screen: true, timezone: true, geolocation: true, battery: true, fonts: true,
  clientRects: false, plugins: true, network: true, hideAdBlocker: true
};
sessionStorage.setItem('v.ui.s', JSON.stringify({
  mode: 'normal',
  platform: 'Win32', hwConcurrency: 8, deviceMemory: 8,
  language: 'et-EE', locale: 'et-EE', countryCode: 'EE',
  languages: ['et-EE', 'et', 'en', 'en-US'],
  timezone: 'Europe/Tallinn',
  noiseSeed: 0x12345678,
  webglVendor: 'Google Inc. (Intel)',
  webglRenderer: 'ANGLE (Intel, Intel(R) Iris(R) Xe Graphics Direct3D11 vs_5_0 ps_5_0)',
  allowedFonts: [
    'Arial', 'Calibri', 'Cambria', 'Comic Sans MS', 'Consolas', 'Courier New',
    'Georgia', 'Impact', 'Segoe UI', 'Tahoma', 'Times New Roman', 'Trebuchet MS',
    'Verdana', 'Marlett', 'MS Gothic', 'Segoe UI Emoji'
  ],
  features: F
}));
sessionStorage.setItem('v.ui.m', 'normal');
document.documentElement.setAttribute('data-v-ft', JSON.stringify(F));

const ORDER = [
  'profile-injector.js', 'mw/mw-bag.js', 'mw/mw-core.js',
  'mw/mw-timezone-screen.js', 'mw/mw-navigator.js', 'mw/mw-canvas-audio.js',
  'mw/mw-misc.js', 'mw/mw-workers.js', 'mw/mw-geo.js',
  'mw/mw-adblock.js', 'mw/mw-cleanup.js'
];
function load(src) {
  return new Promise(r => {
    const s = document.createElement('script');
    s.src = src + '?t=' + Date.now();
    s.onload = () => r(true);
    s.onerror = () => r(false);
    document.head.appendChild(s);
  });
}

const checks = [];
function add(name, ok, detail, skip) {
  checks.push({ name, ok: !!ok, detail: String(detail || ''), skip: !!skip });
}

function measureWidth(family) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = '72px "' + family + '", monospace';
  return ctx.measureText('mmmmmmmmmmlli').width;
}

function domWidth(family) {
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;left:-9999px;font:72px "' + family + '",monospace;';
  span.textContent = 'mmmmmmmmmmlli';
  document.body.appendChild(span);
  const w = span.offsetWidth;
  document.body.removeChild(span);
  return w;
}

(async () => {
  for (const f of ORDER) await load(f);
  await new Promise(r => setTimeout(r, 200));

  const hasFonts = !!(document.fonts && typeof document.fonts.check === 'function');
  add('document.fonts present', hasFonts, hasFonts ? 'FontFaceSet' : 'missing');

  // Invalid CSS must THROW (clean Chrome) — not return false
  let invalidThrew = false;
  let invalidErr = '';
  try {
    document.fonts.check('!!!');
  } catch (e) {
    invalidThrew = true;
    invalidErr = (e && e.name) || 'Error';
  }
  add('check("!!!") throws DOMException', invalidThrew, invalidThrew ? invalidErr : 'returned without throw');

  // Allowed Windows-ish font
  let arialCheck = null;
  try { arialCheck = document.fonts.check('12px Arial'); } catch (e) { arialCheck = 'threw:' + e.message; }
  add('check("12px Arial") true-ish', arialCheck === true, 'got ' + arialCheck);

  // Exotic font — should not look "installed" via width oracle if fonts flag works
  const base = measureWidth('monospace');
  const exotic = 'SomeNonexistentFontXYZ_12345';
  const wMono = measureWidth('monospace');
  const wExotic = measureWidth(exotic);
  // After normalization, exotic often collapses toward generic → width near mono/sans
  add(
    'measureText exotic not wildly unique',
    Math.abs(wExotic - wMono) < 80 || Math.abs(wExotic - measureWidth('sans-serif')) < 80,
    'mono=' + wMono.toFixed(2) + ' exotic=' + wExotic.toFixed(2)
  );

  // Arial should differ from monospace on real Windows (if installed)
  const wArial = measureWidth('Arial');
  add(
    'Arial width differs from monospace (typical)',
    Math.abs(wArial - wMono) > 1,
    'Arial=' + wArial.toFixed(2) + ' mono=' + wMono.toFixed(2),
    false
  );

  // load() for blocked family → empty or resolved list
  let loadBlocked = null;
  try {
    const r = await document.fonts.load('12px "' + exotic + '"');
    loadBlocked = Array.isArray(r) ? r.length : typeof r;
  } catch (e) {
    loadBlocked = 'threw:' + e.message;
  }
  add('load(exotic) does not hang', loadBlocked !== null, 'result len/type=' + loadBlocked);

  // load Arial
  let loadArial = null;
  try {
    const r = await document.fonts.load('12px Arial');
    loadArial = Array.isArray(r) ? ('len=' + r.length) : String(r);
  } catch (e) {
    loadArial = 'threw:' + e.message;
  }
  add('load(Arial) works', !String(loadArial).startsWith('threw'), String(loadArial));

  // toString native on check/load
  try {
    const sc = Function.prototype.toString.call(document.fonts.check);
    const sl = Function.prototype.toString.call(document.fonts.load);
    add('check toString native', /\[native code\]/.test(sc), sc.slice(0, 60));
    add('load toString native', /\[native code\]/.test(sl), sl.slice(0, 60));
  } catch (e) {
    add('check/load toString', false, e.message);
  }

  // document.fonts.size — Shield may force 0 (hide enumeration)
  let fsize = null;
  try { fsize = document.fonts.size; } catch (e) { fsize = 'err'; }
  add('fonts.size readable', fsize !== 'err', 'size=' + fsize);

  // DOM offsetWidth vs canvas measureText same family — should be finite
  const domA = domWidth('Arial');
  add('DOM offsetWidth Arial finite', Number.isFinite(domA) && domA > 0, 'offsetWidth=' + domA);

  // Stable double measure
  const w1 = measureWidth('Arial');
  const w2 = measureWidth('Arial');
  add('measureText Arial stable 2×', w1 === w2, w1 + ' vs ' + w2);

  // --- render ---
  const tbody = document.getElementById('rows');
  let pass = 0, fail = 0, skip = 0;
  checks.forEach((c, i) => {
    const tr = document.createElement('tr');
    let cls = 'fail', lab = 'FAIL';
    if (c.skip) { cls = 'skip'; lab = 'SKIP'; skip++; }
    else if (c.ok) { cls = 'pass'; lab = 'PASS'; pass++; }
    else fail++;
    tr.innerHTML = '<td>' + (i + 1) + '</td><td>' + c.name + '</td><td class="' + cls + '">' + lab +
      '</td><td>' + c.detail.replace(/</g, '&lt;') + '</td>';
    tbody.appendChild(tr);
  });
  const active = pass + fail;
  const verd = document.getElementById('verdict');
  verd.innerHTML = fail === 0
    ? '<span class="pass">ALL ' + pass + ' CHECKS PASSED</span>' + (skip ? ' · ' + skip + ' skipped' : '')
    : '<span class="fail">' + pass + '/' + active + ' passed — ' + fail + ' FAILED</span>';

  document.getElementById('dump').textContent = JSON.stringify({
    fontsSize: fsize,
    checkArial: arialCheck,
    widths: { arial: wArial, mono: wMono, exotic: wExotic, domArial: domA },
    loadArial, loadBlocked
  }, null, 2);
})();
</script>
</body>
</html>
