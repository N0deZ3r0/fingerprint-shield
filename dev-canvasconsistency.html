<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>getImageData vs what toDataURL actually encoded</title></head>
<body><pre id="out">running…</pre>
<script>
// Our canvas defence noises two paths separately: reads (getImageData) and
// encodes (toDataURL / toBlob / convertToBlob, via a noised temp copy). If the
// two ever disagree, a detector does not need to know anything about us — it
// decodes our own PNG and compares it with our own pixel read.
// The decode has to happen in a PRISTINE realm: reading the decoded image back
// through our patched getImageData would apply the noise a second time.
const F = {canvas:true,audio:true,webgl:true,webrtc:true,navigator:true,screen:true,timezone:true,
    geolocation:true,battery:true,fonts:true,clientRects:true,plugins:true,network:true,hideAdBlocker:true};
sessionStorage.setItem('v.ui.s', JSON.stringify({
  mode:'normal', screenWidth:1920, screenHeight:1080, colorDepth:32, devicePixelRatio:1,
  platform:'Win32', hwConcurrency:8, deviceMemory:8, vendor:'Google Inc.',
  language:'et-EE', locale:'et-EE', countryCode:'EE', languages:['et-EE','et','en','en-US'],
  timezone:'Europe/Tallinn', noiseSeed:305419896, maxTouchPoints:0,
  userAgent:navigator.userAgent, appVersion:'5.0 (Windows NT 10.0; Win64; x64)',
  webglVendor:'Google Inc. (Intel)', webglRenderer:'ANGLE (Intel, Iris Xe)', webglParams:{},
  clientHints:{platform:'Windows',mobile:false,platformVersion:'10.0.0',architecture:'x86',bitness:'64',wow64:false,model:'',formFactors:['Desktop']},
  allowedFonts:['Arial','Segoe UI','Tahoma'], mediaDevices:[], plugins:[], mimeTypes:[],
  features:F
}));
sessionStorage.setItem('v.ui.m','normal');
document.documentElement.setAttribute('data-v-ft', JSON.stringify(F));

const ORDER=['profile-injector.js','mw/mw-bag.js','mw/mw-core.js','mw/mw-timezone-screen.js',
 'mw/mw-navigator.js','mw/mw-canvas-audio.js','mw/mw-misc.js','mw/mw-workers.js','mw/mw-geo.js',
 'mw/mw-adblock.js','mw/mw-cleanup.js'];
const load=(s)=>new Promise(r=>{const e=document.createElement('script');e.src=s+'?x='+Date.now();
  e.onload=()=>r(1);e.onerror=()=>r(0);document.head.appendChild(e);});

function h32(b){ let h=2166136261>>>0;
  for(let i=0;i<b.length;i++){ h^=b[i]; h=Math.imul(h,16777619)>>>0; }
  return h.toString(16).padStart(8,'0'); }

const W = 220, H = 110;
function draw(D){
  const c = D.createElement('canvas'); c.width=W; c.height=H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#f0f'); g.addColorStop(1,'#0ff');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,0,0.6)';
  x.beginPath(); x.arc(80,55,40,0,Math.PI*2); x.fill();
  x.font='20px Arial'; x.fillStyle='#036';
  x.fillText('Cwm fjord \u{1F600}', 8, 26);
  return c;
}

(async () => {
  const ifr = document.createElement('iframe'); ifr.style.display='none';
  document.body.appendChild(ifr);
  const D2 = ifr.contentDocument;

  // decode a data URL using ONLY pristine APIs, so we see the true encoded pixels
  function decodePristine(url){
    return new Promise((res, rej) => {
      const img = new (ifr.contentWindow.Image)();
      img.onload = () => {
        const c = D2.createElement('canvas'); c.width=W; c.height=H;
        const x = c.getContext('2d');
        x.drawImage(img, 0, 0);
        res(x.getImageData(0,0,W,H).data);
      };
      img.onerror = () => rej(new Error('decode failed'));
      img.src = url;
    });
  }

  const L = [];

  // sanity check of the method itself, on a pristine canvas
  {
    const c = draw(D2);
    const read = c.getContext('2d').getImageData(0,0,W,H).data;
    const enc  = await decodePristine(c.toDataURL());
    let diff = 0, first = -1;
    for (let i=0;i<read.length;i++) if (read[i]!==enc[i]) { diff++; if (first<0) first=i; }
    L.push('CLEAN realm (method sanity check):');
    L.push('  getImageData     ' + h32(read));
    L.push('  decoded toDataURL ' + h32(enc));
    L.push('  → ' + (diff===0 ? 'identical, as they must be'
      : 'FAIL ' + diff + ' bytes differ — the method itself is unreliable, stop here'));
    L.push('');
  }

  for (const f of ORDER) await load(f);

  {
    const c = draw(document);
    const ctx = c.getContext('2d');
    const read = ctx.getImageData(0,0,W,H).data;
    const enc  = await decodePristine(c.toDataURL());
    let diff = 0, first = -1, sample = [];
    for (let i=0;i<read.length;i++) {
      if (read[i]!==enc[i]) {
        diff++;
        if (sample.length < 6) sample.push('byte ' + i + ' (px ' + ((i/4)|0) + ' ch ' + (i%4) + '): read ' + read[i] + ' vs encoded ' + enc[i]);
        if (first<0) first=i;
      }
    }
    L.push('PATCHED window — same canvas, read one way and encoded the other:');
    L.push('  getImageData      ' + h32(read));
    L.push('  decoded toDataURL ' + h32(enc));
    L.push('  differing bytes: ' + diff + ' of ' + read.length
      + (diff ? '   (' + (100*diff/read.length).toFixed(1) + '%)' : ''));
    sample.forEach(s => L.push('    ' + s));
    L.push('');
    L.push(diff === 0
      ? 'PASS  the pixels we hand out and the pixels we encode are the same.'
      : 'FAIL  our own two outputs disagree. A detector decodes our PNG, compares it\n'
       +'      with our getImageData and catches us without knowing anything about us.');
    L.push('');

    // second read of the same canvas must be byte-stable
    const read2 = ctx.getImageData(0,0,W,H).data;
    let d2 = 0; for (let i=0;i<read.length;i++) if (read[i]!==read2[i]) d2++;
    L.push((d2===0?'PASS  ':'FAIL  ') + 'repeated getImageData is byte-stable (' + d2 + ' differing)');

    // and a second encode must be byte-stable too
    const u1 = c.toDataURL(), u2 = c.toDataURL();
    L.push((u1===u2?'PASS  ':'FAIL  ') + 'repeated toDataURL is byte-stable');

    // toBlob must agree with toDataURL
    const blobBytes = await new Promise(r => c.toBlob(b => {
      const fr = new FileReader(); fr.onload = () => r(new Uint8Array(fr.result)); fr.readAsArrayBuffer(b);
    }, 'image/png'));
    const urlBytes = Uint8Array.from(atob(u1.split(',')[1]), ch => ch.charCodeAt(0));
    const sameLen = blobBytes.length === urlBytes.length;
    let bd = 0; if (sameLen) for (let i=0;i<blobBytes.length;i++) if (blobBytes[i]!==urlBytes[i]) bd++;
    L.push((sameLen && bd===0 ? 'PASS  ' : 'FAIL  ') + 'toBlob bytes == toDataURL bytes'
      + (sameLen ? ' (' + bd + ' differing)' : ' (lengths ' + blobBytes.length + ' vs ' + urlBytes.length + ')'));
  }

  document.getElementById('out').textContent = L.join('\n');
})();
</script>
</body></html>
