<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebGPU ↔ WebGL parity</title>
  <style>
    body { font: 13px/1.45 system-ui, sans-serif; margin: 16px; max-width: 820px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .sub { color: #666; margin-bottom: 14px; }
    table { border-collapse: collapse; width: 100%; margin: 10px 0 16px; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 12px; }
    th { background: #f4f4f4; }
    .pass { color: #0a7; font-weight: 600; }
    .fail { color: #c22; font-weight: 600; }
    .skip { color: #a80; font-weight: 600; }
    #verdict { font-size: 15px; font-weight: 700; margin: 12px 0; }
    pre { background: #111; color: #ddd; padding: 10px; border-radius: 6px; font-size: 11px; overflow: auto; }
  </style>
</head>
<body>
<h1>WebGPU ↔ WebGL parity</h1>
<p class="sub">
  Shield: <code>adapter.info</code> must match GPU family of WebGL UNMASKED_*
  (Intel↔intel, NVIDIA↔nvidia). isFallbackAdapter=false on desktop profile.
</p>
<div id="verdict">running…</div>
<div id="out">running…</div>
<table>
  <thead><tr><th>#</th><th>check</th><th>verdict</th><th>detail</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<pre id="dump"></pre>

<script>
const F = {
  canvas: true, audio: true, webgl: true, webrtc: true, navigator: true,
  screen: true, timezone: true, geolocation: true, battery: true, fonts: true,
  clientRects: false, plugins: true, network: true, hideAdBlocker: true
};
// The spoofed GPU is chosen to DIFFER from the real one, and that is not cosmetic.
// This page was first written with a fixed Intel profile, and on an Intel host every
// scope-parity row passed with the worker patch deleted — an unpatched worker reports the
// real card, the real card was Intel, and the test could not tell the two apart. A test
// that only passes because the lie happens to equal the truth is not testing anything.
//
// So the real family is measured first (before any mw/*.js runs — nothing has patched
// WebGL at this point) and the profile is set to a different one. On Intel hardware the
// page pretends to be NVIDIA and vice versa, so an unpatched scope is always visibly wrong.
const NATIVE_FAMILY = (function () {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
    if (!dbg) return 'unknown';
    const s = String(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || '') + ' ' +
      String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '');
    return /nvidia/i.test(s) ? 'nvidia' : /amd|ati|radeon/i.test(s) ? 'amd'
      : /intel/i.test(s) ? 'intel' : /apple/i.test(s) ? 'apple' : 'unknown';
  } catch (e) { return 'unknown'; }
})();
const SPOOF = NATIVE_FAMILY === 'nvidia'
  ? {
    webglVendor: 'Google Inc. (Intel)',
    webglRenderer: 'ANGLE (Intel, Intel(R) Iris(R) Xe Graphics Direct3D11 vs_5_0 ps_5_0)',
    webgpuVendor: 'intel', webgpuArchitecture: 'xe-lpg'
  }
  : {
    webglVendor: 'Google Inc. (NVIDIA)',
    webglRenderer: 'ANGLE (NVIDIA, NVIDIA GeForce RTX 3060 Direct3D11 vs_5_0 ps_5_0)',
    webgpuVendor: 'nvidia', webgpuArchitecture: 'ampere'
  };
sessionStorage.setItem('v.ui.s', JSON.stringify({
  mode: 'normal',
  platform: 'Win32', hwConcurrency: 8, deviceMemory: 8,
  language: 'et-EE', locale: 'et-EE', countryCode: 'EE',
  languages: ['et-EE', 'et', 'en', 'en-US'],
  timezone: 'Europe/Tallinn',
  noiseSeed: 0x12345678,
  webglVendor: SPOOF.webglVendor,
  webglRenderer: SPOOF.webglRenderer,
  webgpuVendor: SPOOF.webgpuVendor,
  webgpuArchitecture: SPOOF.webgpuArchitecture,
  webgpuDevice: '',
  webgpuDescription: '',
  features: F
}));
sessionStorage.setItem('v.ui.m', 'normal');
document.documentElement.setAttribute('data-v-ft', JSON.stringify(F));

const ORDER = [
  '../profile-injector.js', '../mw/mw-bag.js', '../mw/mw-core.js',
  '../mw/mw-timezone-screen.js', '../mw/mw-navigator.js', '../mw/mw-canvas-audio.js',
  '../mw/mw-misc.js', '../mw/mw-workers.js', '../mw/mw-geo.js',
  '../mw/mw-adblock.js', '../mw/mw-cleanup.js'
];
function load(src) {
  return new Promise(r => {
    const s = document.createElement('script');
    s.src = src + '?t=' + Date.now();
    s.onload = () => r(true);
    s.onerror = () => r(false);
    document.head.appendChild(s);
  });
}

const checks = [];
function add(name, ok, detail, skip) {
  checks.push({ name, ok: !!ok, detail: String(detail || ''), skip: !!skip });
}

function familyFromWebGL(vendor, renderer) {
  const s = (vendor + ' ' + renderer).toLowerCase();
  if (s.includes('nvidia')) return 'nvidia';
  if (s.includes('amd') || s.includes('ati') || s.includes('radeon')) return 'amd';
  if (s.includes('intel')) return 'intel';
  if (s.includes('apple')) return 'apple';
  return 'unknown';
}

(async () => {
  for (const f of ORDER) await load(f);
  await new Promise(r => setTimeout(r, 250));

  // --- WebGL baseline ---
  let glVendor = '', glRenderer = '';
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        glVendor = String(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || '');
        glRenderer = String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '');
      }
    }
  } catch (e) {}

  const glFamily = familyFromWebGL(glVendor, glRenderer);
  add('WebGL context', !!(glVendor || glRenderer), glVendor ? glVendor + ' | ' + glRenderer.slice(0, 60) : 'no WebGL');

  // --- WebGPU ---
  const hasGpu = !!(navigator.gpu && typeof navigator.gpu.requestAdapter === 'function');
  add('navigator.gpu present', hasGpu, hasGpu ? 'ok' : 'WebGPU unsupported in this browser', !hasGpu);

  let adapter = null;
  let info = null;
  let err = null;
  if (hasGpu) {
    try {
      adapter = await navigator.gpu.requestAdapter();
      // [CLEANUP dead-webgpu-api] The legacy `await adapter.requestAdapterInfo()` fallback
      // that used to sit here is gone: Chrome removed the method (measured —
      // GPUAdapter.prototype is features / limits / info / requestDevice / constructor),
      // so it could only ever be dead weight in the page as it was in the patch.
      if (adapter) info = adapter.info || null;
    } catch (e) {
      err = e && e.message;
    }
  }

  add('requestAdapter returns adapter', !!adapter, adapter ? 'GPUAdapter' : (err || 'null'), !hasGpu);

  const vendor = info && info.vendor != null ? String(info.vendor) : '';
  const architecture = info && info.architecture != null ? String(info.architecture) : '';
  const device = info && info.device != null ? String(info.device) : '';
  const description = info && info.description != null ? String(info.description) : '';
  let isFallback = null;
  try {
    if (info && 'isFallbackAdapter' in info) isFallback = !!info.isFallbackAdapter;
    else if (adapter && 'isFallbackAdapter' in adapter) isFallback = !!adapter.isFallbackAdapter;
  } catch (e) {}

  add('adapter.info readable', !!(info && vendor !== undefined), vendor ? 'vendor=' + vendor : 'no info', !adapter);
  add('vendor non-empty', !!vendor, vendor || '(empty)', !adapter);
  add('isFallbackAdapter === false', isFallback === false, 'got ' + String(isFallback), !adapter || isFallback === null);

  // Family coherence WebGL ↔ WebGPU
  const wgFamily = (vendor || '').toLowerCase();
  const familyMatch =
    (glFamily === 'intel' && wgFamily === 'intel') ||
    (glFamily === 'nvidia' && wgFamily === 'nvidia') ||
    (glFamily === 'amd' && (wgFamily === 'amd' || wgFamily === 'ati')) ||
    (glFamily === 'apple' && wgFamily === 'apple');
  add(
    'WebGL family ↔ WebGPU vendor',
    familyMatch,
    'webgl=' + glFamily + ' webgpu=' + (wgFamily || '(empty)'),
    !adapter || !glFamily || glFamily === 'unknown'
  );

  // The profile must actually be a lie, or nothing below distinguishes a patched scope
  // from an unpatched one. Reported as its own row so a future host that defeats the
  // NATIVE_FAMILY heuristic shows up as a weakened test rather than a silent green.
  add('the spoofed GPU family differs from the real one (test is load-bearing)',
    NATIVE_FAMILY !== 'unknown' && SPOOF.webgpuVendor !== NATIVE_FAMILY,
    'real=' + NATIVE_FAMILY + ' spoofed=' + SPOOF.webgpuVendor,
    NATIVE_FAMILY === 'unknown');

  add('profile vendor reaches adapter.info', vendor === SPOOF.webgpuVendor,
    'want "' + SPOOF.webgpuVendor + '" got "' + vendor + '"', !adapter);
  add('profile architecture reaches adapter.info', architecture === SPOOF.webgpuArchitecture,
    'want "' + SPOOF.webgpuArchitecture + '" got "' + architecture + '"', !adapter);

  // toString native-ish on requestAdapter
  let raNative = false;
  try {
    const s = Function.prototype.toString.call(navigator.gpu.requestAdapter);
    raNative = /\[native code\]/.test(s);
    add('requestAdapter toString native', raNative, s.slice(0, 70));
  } catch (e) {
    add('requestAdapter toString native', false, e.message);
  }

  // Stable across 2 calls
  if (hasGpu) {
    try {
      const a2 = await navigator.gpu.requestAdapter();
      const v2 = a2 && a2.info && a2.info.vendor;
      add('2× requestAdapter stable vendor', v2 === vendor, '1=' + vendor + ' 2=' + v2, !a2);
    } catch (e) {
      add('2× requestAdapter stable vendor', false, e.message);
    }
  }

  // --- object SHAPE, not just values -------------------------------------------------
  // [FIX webgpu-info-patched-on-the-instance] A real GPUAdapterInfo carries its data on
  // GPUAdapterInfo.prototype and owns nothing. The patch used to define the five fields on
  // the instance, so `JSON.stringify(adapter.info)` returned a populated object where a
  // clean browser returns "{}" — the spoof was easier to spot than the GPU it was hiding.
  // Same class as the PermissionStatus/TextMetrics fixes in mw/mw-misc.js.
  if (adapter && info) {
    const own = Object.getOwnPropertyNames(info);
    add('adapter.info owns no properties (native owns none)', own.length === 0,
      own.length ? own.join(', ') : '[]');
    add('JSON.stringify(adapter.info) === "{}"', JSON.stringify(info) === '{}',
      JSON.stringify(info).slice(0, 70));
    add('adapter.info is a GPUAdapterInfo', Object.prototype.toString.call(info) === '[object GPUAdapterInfo]',
      Object.prototype.toString.call(info));
    const d = Object.getOwnPropertyDescriptor(GPUAdapterInfo.prototype, 'vendor');
    add('vendor lives on the prototype as a get-only accessor',
      !!(d && typeof d.get === 'function' && d.set === undefined && d.enumerable && d.configurable),
      d ? ('get=' + typeof d.get + ' set=' + typeof d.set + ' enum=' + d.enumerable) : 'absent');
    add('vendor getter name is "get vendor"', d && d.get && d.get.name === 'get vendor',
      d && d.get ? JSON.stringify(d.get.name) : '—');
    // Dead API must stay dead: if Chrome ever brings these back, the patch needs revisiting.
    add('adapter.requestAdapterInfo absent (removed from the platform)',
      typeof adapter.requestAdapterInfo === 'undefined', typeof adapter.requestAdapterInfo);
    add('adapter.isFallbackAdapter absent (moved onto info)',
      !('isFallbackAdapter' in adapter), String('isFallbackAdapter' in adapter));
    // [FIX requestAdapter-wrapper-put-this-file-in-the-page-console] requestAdapter is not
    // wrapped at all any more, so it must stringify like the native method it is — WITH its
    // name. A masked wrapper cannot: Function.prototype.toString on a callable Proxy always
    // drops the name and returns "function () { [native code] }". That difference is what
    // makes this check able to tell "untouched" from "well disguised".
    const raStr = Function.prototype.toString.call(GPU.prototype.requestAdapter);
    add('GPU.prototype.requestAdapter is untouched, not masked',
      raStr === 'function requestAdapter() { [native code] }', raStr);
    add('GPU.prototype.requestAdapter.length === 0 (native arity)',
      GPU.prototype.requestAdapter.length === 0, String(GPU.prototype.requestAdapter.length));
  }

  // --- the point of the whole exercise: window ↔ iframe ↔ worker ----------------------
  // A site can read adapter.info from three realms. If they disagree it does not need to
  // know the true GPU to know it is being lied to — the same read that hasBadWebGL does
  // for UNMASKED_RENDERER, one API over.
  async function scopeInfo(G) {
    const a = await G.navigator.gpu.requestAdapter();
    if (!a) return null;
    return {
      vendor: a.info.vendor, architecture: a.info.architecture,
      device: a.info.device, description: a.info.description,
      isFallbackAdapter: a.info.isFallbackAdapter,
      own: Object.getOwnPropertyNames(a.info).length,
      json: JSON.stringify(a.info)
    };
  }
  const mine = adapter ? await scopeInfo(window) : null;

  // The iframe has to be given the module set by hand. In the shipped extension the
  // manifest does it (all_frames + match_about_blank); this page is a standalone harness
  // with no extension behind it, so a bare about:blank frame is simply unpatched and
  // comparing against it measures the harness, not the product — the first version of this
  // block reported two failures for exactly that reason. Loading the same ORDER into the
  // frame asks the real question a standalone page can ask: does one module set applied to
  // a second realm reach the same answer.
  async function loadInto(win) {
    for (const src of ORDER) {
      await new Promise((r) => {
        const s = win.document.createElement('script');
        s.src = src + '?t=' + Date.now();
        s.onload = s.onerror = () => r();
        (win.document.head || win.document.documentElement).appendChild(s);
      });
    }
  }
  let frameInfo = null;
  if (adapter) {
    try {
      const fr = document.createElement('iframe');
      fr.style.display = 'none';
      document.documentElement.appendChild(fr);
      await new Promise(r => setTimeout(r, 60));
      // Same origin, so the frame reads the same sessionStorage profile this page set.
      await loadInto(fr.contentWindow);
      await new Promise(r => setTimeout(r, 200));
      frameInfo = await scopeInfo(fr.contentWindow);
      fr.remove();
    } catch (e) { frameInfo = { err: e.message }; }
  }

  let workerInfo = null;
  if (adapter) {
    try {
      const code = 'self.onmessage=async()=>{try{' +
        'if(typeof navigator.gpu==="undefined"){postMessage({err:"no navigator.gpu"});return;}' +
        'const a=await navigator.gpu.requestAdapter();' +
        'if(!a){postMessage({err:"null adapter"});return;}' +
        'postMessage({vendor:a.info.vendor,architecture:a.info.architecture,' +
        'device:a.info.device,description:a.info.description,' +
        'isFallbackAdapter:a.info.isFallbackAdapter,' +
        'own:Object.getOwnPropertyNames(a.info).length,json:JSON.stringify(a.info)});' +
        '}catch(e){postMessage({err:String(e)});}};';
      const u = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
      workerInfo = await new Promise((res) => {
        const w = new Worker(u);
        const t = setTimeout(() => { try { w.terminate(); } catch (e) {} res({ err: 'timeout' }); }, 10000);
        w.onmessage = (ev) => { clearTimeout(t); try { w.terminate(); } catch (e) {} res(ev.data); };
        w.onerror = (ev) => { clearTimeout(t); res({ err: ev.message || 'worker failed' }); };
        w.postMessage(1);
      });
      URL.revokeObjectURL(u);
    } catch (e) { workerInfo = { err: e.message }; }
  }

  function compareScope(label, other) {
    if (!mine) return;
    if (!other || other.err) {
      add(label + ' reachable', false, (other && other.err) || 'no result', !adapter);
      return;
    }
    for (const k of ['vendor', 'architecture', 'device', 'description', 'isFallbackAdapter', 'own', 'json']) {
      add(label + ' ' + k + ' === window',
        String(other[k]) === String(mine[k]),
        'window=' + JSON.stringify(mine[k]) + ' ' + label + '=' + JSON.stringify(other[k]));
    }
  }
  compareScope('iframe', frameInfo);
  compareScope('worker', workerInfo);

  // --- render ---
  const tbody = document.getElementById('rows');
  let pass = 0, fail = 0, skip = 0;
  checks.forEach((c, i) => {
    const tr = document.createElement('tr');
    let cls = 'fail', lab = 'FAIL';
    if (c.skip) { cls = 'skip'; lab = 'SKIP'; skip++; }
    else if (c.ok) { cls = 'pass'; lab = 'PASS'; pass++; }
    else fail++;
    tr.innerHTML = '<td>' + (i + 1) + '</td><td>' + c.name + '</td><td class="' + cls + '">' + lab + '</td><td>' + c.detail.replace(/</g, '&lt;') + '</td>';
    tbody.appendChild(tr);
  });

  const active = pass + fail;
  const verd = document.getElementById('verdict');
  if (fail === 0) {
    verd.innerHTML = '<span class="pass">ALL ' + pass + ' CHECKS PASSED</span>' + (skip ? ' · ' + skip + ' skipped' : '');
  } else {
    verd.innerHTML = '<span class="fail">' + pass + '/' + active + ' passed — ' + fail + ' FAILED</span>';
  }

  // Machine-readable verdict in #out, the shape test/run.mjs reads first.
  //
  // This page is deliberately NOT in that runner's CHECKS list. WebGPU needs a real GPU:
  // headless Chromium exposes navigator.gpu on a secure origin but requestAdapter()
  // resolves to null, so every meaningful row would skip and the page would report
  // FAILURES: 0 forever — a green light that measured nothing. It is listed under
  // NOT_COVERED with the command that does work:
  //     node test/run.mjs --headed webgpu
  // The no-adapter state says so in words rather than pretending to a result.
  const out = document.getElementById('out');
  if (!adapter) {
    out.innerHTML = '<span class="fail">NO GPU ADAPTER — nothing was verified.</span> ' +
      'requestAdapter() returned ' + (hasGpu ? 'null' : 'nothing: navigator.gpu is absent') +
      '. WebGPU needs a real GPU and a secure origin; headless has neither. Run ' +
      '<code>node test/run.mjs --headed webgpu</code>.' +
      '<br>FAILURES: 0 — SKIPPED, no adapter';
  } else {
    out.innerHTML = '<b>FAILURES: ' + fail + '</b>' +
      (fail ? '' : ' — WebGPU identity matches the WebGL profile in window, iframe and worker') +
      (skip ? ' · ' + skip + ' skipped' : '');
  }

  document.getElementById('dump').textContent = JSON.stringify({
    webgl: { vendor: glVendor, renderer: glRenderer, family: glFamily },
    webgpu: { vendor, architecture, device, description, isFallbackAdapter: isFallback },
    scopes: { window: mine, iframe: frameInfo, worker: workerInfo },
    requestAdapterNative: raNative
  }, null, 2);
})();
</script>
</body>
</html>
