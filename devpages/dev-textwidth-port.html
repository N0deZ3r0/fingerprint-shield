<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JS port of substitute_text_width vs the real WASM</title></head>
<body><pre id="out">running…</pre>
<script>
// The window takes text widths from WASM (__w0.substituteTextWidth); a worker has
// no WASM. Before porting font normalisation into the worker payload, the JS
// replacement must reproduce the WASM output EXACTLY — otherwise the two scopes
// disagree on every width and we trade one split for another.
// Ported from protect_c.source:
//   h = seed; h = hash_str(h, font); h = hash_str(h, text)
//   return real + ((h & 0xFF)/255 - 0.5) * 0.02
const SEED = 0x12345678;
sessionStorage.setItem('v.ui.s', JSON.stringify({
  timezone:'Europe/Tallinn', language:'et-EE', noiseSeed:SEED, mode:'normal'
}));

// hash_str takes const char* — emscripten hands it UTF-8 BYTES, so the port must
// hash bytes, not UTF-16 code units. This is the same trap the wrapper hit once
// before (see the lengthBytesUTF8 fix covered by dev-wasm.html).
const UTF8 = new TextEncoder();
function hashStr(base, str) {
  let h = base >>> 0;
  const bytes = UTF8.encode(str == null ? '' : String(str));
  for (let i = 0; i < bytes.length; i++) {
    h = (h ^ bytes[i]) >>> 0;
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  h = (h ^ (h >>> 16)) >>> 0;
  h = Math.imul(h, 0x85EBCA6B) >>> 0;
  h = (h ^ (h >>> 13)) >>> 0;
  return h;
}
function portWidth(real, font, text, seed) {
  let h = seed >>> 0;
  h = hashStr(h, font);
  h = hashStr(h, text);
  return real + ((h & 0xFF) / 255 - 0.5) * 0.02;
}
function portMetric(prop, real, seed) {
  // the JS wrapper in background.js short-circuits a falsy prop before it ever
  // reaches WASM (dev-runtime.html asserts "substituteTextMetrics passes through
  // empty prop"), so the port has to short-circuit at the same place
  if (!prop) return real;
  let h = hashStr(seed >>> 0, prop);
  return real + ((h & 0xFF) / 255 - 0.5) * 0.002;
}

(async () => {
  const L = [];
  let loader = null;
  try {
    const src = await (await fetch('../background.js?x='+Date.now())).text();
    // [FIX wasm-fetch-was-visible-to-the-page] The loader takes BYTES now, not a URL:
    // fetching from inside the MAIN world let any page that had replaced window.fetch see
    // a chrome-extension:// request for protect.wasm. This page therefore reads the file
    // itself and hands the bytes in, which is what background.js does from the worker.
    const marker = 'func: async function(wasmBytes, noiseSeedArg, tzArg, langArg) {';
    const at = src.indexOf(marker);
    if (at === -1) throw new Error('loader marker not found');
    const open = src.indexOf('{', at + marker.length - 1);
    let depth = 0, end = -1;
    for (let i = open; i < src.length; i++) {
      if (src[i] === '{') depth++;
      else if (src[i] === '}') { depth--; if (depth === 0) { end = i + 1; break; } }
    }
    const body = src.slice(src.indexOf('async function', at), end);
    loader = new Function('return (' + body + ')')();
  } catch (e) { L.push('FAIL extract loader: ' + e.message); }

  const WASM_BYTES = Array.from(new Uint8Array(await (await fetch('../protect.wasm?x='+Date.now())).arrayBuffer()));
  if (!loader) { document.getElementById('out').textContent = L.join('\n'); return; }
  const res = await loader(WASM_BYTES, SEED, '', '');
  L.push('loader: ' + JSON.stringify(res));
  const W = window.__w0;
  if (!W || !W.substituteTextWidth) {
    L.push('FAIL wrapper missing');
    document.getElementById('out').textContent = L.join('\n'); return;
  }

  const FONTS = ['16px monospace', '72px "Segoe UI", monospace', '14px Arial',
    '12px "MS Gothic"', 'bold 16px/1.5 "Helvetica Neue", sans-serif', '',
    '16px "Ｍｓ ゴシック"'];
  const TEXTS = ['mwmwmwmwlli', 'mmmmmmmmmmlli', 'Handgloves', '', 'a',
    '😃 emoji', 'Привет', '日本語テキスト',
    'x'.repeat(200)];
  const REALS = [0, 1, 123.3984375, 468, 647.75, 1e6];

  let n = 0, bad = 0, worst = 0, firstBad = null;
  for (const f of FONTS) for (const t of TEXTS) for (const r of REALS) {
    const a = W.substituteTextWidth(r, f, t);
    const b = portWidth(r, f, t, SEED);
    n++;
    const d = Math.abs(a - b);
    if (d > worst) worst = d;
    if (a !== b) { bad++; if (!firstBad) firstBad = {f, t, r, wasm: a, port: b}; }
  }
  L.push('');
  L.push('substituteTextWidth — ' + n + ' combinations (fonts × texts × widths,');
  L.push('  including empty strings, emoji, Cyrillic, CJK and a 200-char string)');
  L.push((bad === 0 ? 'PASS  ' : 'FAIL  ') + 'JS port is bit-identical to WASM'
    + (bad ? '   ' + bad + ' differ, worst |Δ| ' + worst + '\n      first: ' + JSON.stringify(firstBad) : ''));

  // the other substitution the window applies to every non-width metric
  const PROPS = ['actualBoundingBoxLeft','actualBoundingBoxRight','actualBoundingBoxAscent',
    'actualBoundingBoxDescent','fontBoundingBoxAscent','fontBoundingBoxDescent',
    'emHeightAscent','emHeightDescent','hangingBaseline','alphabeticBaseline',
    'ideographicBaseline','width',''];
  let n2 = 0, bad2 = 0, firstBad2 = null;
  for (const p of PROPS) for (const r of REALS) {
    const a = W.substituteTextMetrics(p, r);
    const b = portMetric(p, r, SEED);
    n2++;
    if (a !== b) { bad2++; if (!firstBad2) firstBad2 = {p, r, wasm: a, port: b}; }
  }
  L.push('');
  L.push('substituteTextMetrics — ' + n2 + ' combinations');
  L.push((bad2 === 0 ? 'PASS  ' : 'FAIL  ') + 'JS port is bit-identical to WASM'
    + (bad2 ? '   ' + bad2 + ' differ\n      first: ' + JSON.stringify(firstBad2) : ''));

  document.getElementById('out').textContent = L.join('\n');
})();
</script>
</body></html>
