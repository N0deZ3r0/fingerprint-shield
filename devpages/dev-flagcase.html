<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>flag case</title></head>
<body><pre id="out">running…</pre>
<script>
// One realm, one feature-flag configuration. ?off=fonts turns exactly that flag
// off and leaves the other 13 on; ?off= (empty) is the all-on baseline.
// Reports which of the reference APIs ended up patched in THIS realm.
// Must be the key set of AFP_DEFAULT_FEATURES in defaults.js. It carried a 14th name,
// 'audio', long after that flag went with the AudioContext noise — so the fixture handed
// mw-core a features object with a key its defaults do not have.
const KEYS = ['canvas','webgl','webrtc','navigator','screen','timezone',
  'geolocation','battery','fonts','clientRects','plugins','network','hideAdBlocker'];
const off = new URLSearchParams(location.search).get('off') || '';
const FT = {}; KEYS.forEach(k => FT[k] = true);
off.split(',').filter(Boolean).forEach(k => FT[k] = false);

sessionStorage.setItem('v.ui.s', JSON.stringify({
  // colorDepth 24, not 32 — see [FIX color-depth-was-a-value-chrome-never-reports] in
  // background.js. A fixture that ships a value the extension no longer produces makes
  // the realm under test differ from the shipped one for no reason.
  mode:'normal', screenWidth:1920, screenHeight:1080, colorDepth:24, devicePixelRatio:1,
  platform:'Win32', hwConcurrency:8, deviceMemory:8, vendor:'Google Inc.',
  language:'et-EE', locale:'et-EE', countryCode:'EE', languages:['et-EE','et','en','en-US'],
  timezone:'Europe/Tallinn', noiseSeed:305419896, maxTouchPoints:0,
  userAgent:navigator.userAgent, appVersion:'5.0 (Windows NT 10.0; Win64; x64)',
  webglVendor:'Google Inc. (Intel)', webglRenderer:'ANGLE (Intel, Iris Xe)', webglParams:{},
  clientHints:{platform:'Windows',mobile:false,platformVersion:'10.0.0',architecture:'x86',bitness:'64',wow64:false,model:'',formFactors:['Desktop']},
  allowedFonts:['Arial','Segoe UI','Tahoma'], mediaDevices:[], plugins:[], mimeTypes:[],
  features: FT
}));
sessionStorage.setItem('v.ui.m','normal');
// [CLEANUP] A `data-v-ft` attribute was written here. Nothing has read it since
// [FIX bridge-attributes-were-an-extension-detector] removed the whole data-v-* channel
// and mw-core dropped its reader with it — the flags reach this realm through
// v.ui.s.features above, which is the legacy carrier mw-core adopts once and wipes.
// Left in, it made the fixture the only thing in the repo still putting an attribute on
// <html>, i.e. a realm shaped unlike the one being tested.

const ORDER=['../profile-injector.js','../mw/mw-bag.js','../mw/mw-core.js','../mw/mw-timezone-screen.js',
 '../mw/mw-navigator.js','../mw/mw-canvas-audio.js','../mw/mw-misc.js','../mw/mw-workers.js','../mw/mw-geo.js','../mw/mw-adblock.js'];
const load=(s)=>new Promise(r=>{const e=document.createElement('script');e.src=s+'?x='+Date.now();
  e.onload=()=>r(1);e.onerror=()=>r(0);document.head.appendChild(e);});

const REFS = [
  ['ctx2d.measureText',      ()=>CanvasRenderingContext2D.prototype.measureText],
  ['ctx2d.fillText',         ()=>CanvasRenderingContext2D.prototype.fillText],
  ['ctx2d.strokeText',       ()=>CanvasRenderingContext2D.prototype.strokeText],
  ['ctx2d.getImageData',     ()=>CanvasRenderingContext2D.prototype.getImageData],
  ['canvas.toDataURL',       ()=>HTMLCanvasElement.prototype.toDataURL],
  ['canvas.getContext',      ()=>HTMLCanvasElement.prototype.getContext],
  ['TextMetrics.width',      ()=>Object.getOwnPropertyDescriptor(TextMetrics.prototype,'width').get],
  ['FontFaceSet.check',      ()=>FontFaceSet.prototype.check],
  ['AnalyserNode.getFloatFrequencyData', ()=>AnalyserNode.prototype.getFloatFrequencyData],
  ['AudioBuffer.getChannelData',         ()=>AudioBuffer.prototype.getChannelData],
  ['WebGL.getParameter',     ()=>WebGLRenderingContext.prototype.getParameter],
  ['RTCPeerConnection.onicecandidate', ()=>Object.getOwnPropertyDescriptor(RTCPeerConnection.prototype,'onicecandidate').set],
  ['window.matchMedia',      ()=>window.matchMedia],
  ['Screen.width',           ()=>Object.getOwnPropertyDescriptor(Screen.prototype,'width').get],
  ['window.innerWidth',      ()=>Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window),'innerWidth').get],
  ['Date.getTimezoneOffset', ()=>Date.prototype.getTimezoneOffset],
  ['Date.toString',          ()=>Date.prototype.toString],
  ['Intl.DateTimeFormat',    ()=>Intl.DateTimeFormat],
  ['Number.toLocaleString',  ()=>Number.prototype.toLocaleString],
  ['Geolocation.getCurrentPosition', ()=>Geolocation.prototype.getCurrentPosition],
  ['PermissionStatus.state', ()=>Object.getOwnPropertyDescriptor(PermissionStatus.prototype,'state').get],
  ['Navigator.getBattery',   ()=>Navigator.prototype.getBattery],
  ['BatteryManager.level',   ()=>Object.getOwnPropertyDescriptor(BatteryManager.prototype,'level').get],
  ['window.getComputedStyle',()=>window.getComputedStyle],
  ['Navigator.deviceMemory', ()=>Object.getOwnPropertyDescriptor(Navigator.prototype,'deviceMemory').get],
  ['Navigator.hardwareConcurrency', ()=>Object.getOwnPropertyDescriptor(Navigator.prototype,'hardwareConcurrency').get],
  ['MediaDevices.enumerateDevices', ()=>MediaDevices.prototype.enumerateDevices],
  ['Keyboard.getLayoutMap',  ()=>navigator.keyboard&&Object.getPrototypeOf(navigator.keyboard).getLayoutMap],
  ['SpeechSynthesis.getVoices', ()=>SpeechSynthesis.prototype.getVoices],
  ['UAData.getHighEntropyValues', ()=>NavigatorUAData.prototype.getHighEntropyValues],
  ['UAData.brands',          ()=>Object.getOwnPropertyDescriptor(NavigatorUAData.prototype,'brands').get],
  ['Navigator.plugins',      ()=>Object.getOwnPropertyDescriptor(Navigator.prototype,'plugins').get],
  ['NetworkInformation.effectiveType', ()=>Object.getOwnPropertyDescriptor(NetworkInformation.prototype,'effectiveType').get],
  ['Element.getBoundingClientRect', ()=>Element.prototype.getBoundingClientRect],
  ['Element.getClientRects', ()=>Element.prototype.getClientRects],
  ['Error.stack',            ()=>Object.getOwnPropertyDescriptor(Error.prototype,'stack').get],
  ['Performance.now',        ()=>Performance.prototype.now],
  ['Worker',                 ()=>window.Worker]
];

(async()=>{
  const PRE = REFS.map(([k,g])=>{ let v; try{ v=g(); }catch(e){ v='ERR'; } return [k,g,v]; });
  for(const f of ORDER) await load(f);
  const patched=[];
  for (const [k,g,before] of PRE){
    let now; try{ now=g(); }catch(e){ now='ERR'; }
    if (now!==before) patched.push(k);
  }
  const msg={off:off, patched:patched, total:REFS.length};
  document.getElementById('out').textContent=JSON.stringify(msg,null,1);
  try{ parent.postMessage(msg,'*'); }catch(e){}
})();
</script>
</body></html>
