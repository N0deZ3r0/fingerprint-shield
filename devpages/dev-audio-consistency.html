<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Audio Consistency — OfflineAudioContext & Analyser</title>
  <style>
    body { font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 16px; max-width: 1000px; }
    h3 { margin: 0 0 6px; }
    .info { opacity: .7; margin-bottom: 12px; }
    .ok  { color: #137333; font-weight: 700; }
    .bad { color: #c5221f; font-weight: 700; }
    .skip { color: #888; }
    table { border-collapse: collapse; margin: 12px 0; width: 100%; }
    th, td { padding: 3px 10px; text-align: left; border-bottom: 1px solid #8884; }
    #sum { margin: 14px 0; padding: 10px 12px; border-radius: 6px; font-weight: 700; }
    .green { background: #e6f4ea; color: #137333; }
    .red   { background: #fce8e6; color: #c5221f; }
    pre { white-space: pre-wrap; margin-top: 12px; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #ddd; }
      .green { background: #0d2a17; color: #7ee2a8; }
      .red   { background: #2d1210; color: #ffa9a3; }
    }
  </style>
</head>
<body>
<h3>Audio Consistency — OfflineAudioContext & AnalyserNode</h3>
<p class="info">
  Shield шумит OfflineAudioContext (LCG / WASM, scale ~0.003) и AnalyserNode.
  Тест: стабильность, детерминизм, amplitude, parity каналов, Analyser.
</p>
<div id="sum">running…</div>
<table id="t">
  <thead><tr><th>check</th><th>verdict</th><th>detail</th></tr></thead>
  <tbody></tbody>
</table>
<pre id="log"></pre>

<script>
const F = {
  canvas:true, audio:true, webgl:true, webrtc:true, navigator:true,
  screen:true, timezone:true, geolocation:true, battery:true, fonts:true,
  clientRects:false, plugins:true, network:true, hideAdBlocker:true
};
sessionStorage.setItem('v.ui.s', JSON.stringify({
  mode: 'normal',
  platform: 'Win32', hwConcurrency: 8, deviceMemory: 8,
  language: 'et-EE', locale: 'et-EE', countryCode: 'EE',
  languages: ['et-EE','et','en','en-US'],
  timezone: 'Europe/Tallinn',
  noiseSeed: 0x12345678,
  webglVendor: 'Google Inc. (Intel)',
  webglRenderer: 'ANGLE (Intel, Intel(R) Iris(R) Xe Graphics Direct3D11 vs_5_0 ps_5_0)',
  features: F
}));
sessionStorage.setItem('v.ui.m', 'normal');
document.documentElement.setAttribute('data-v-ft', JSON.stringify(F));

const ORDER = [
  '../profile-injector.js', '../mw/mw-bag.js', '../mw/mw-core.js',
  '../mw/mw-timezone-screen.js', '../mw/mw-navigator.js', '../mw/mw-canvas-audio.js',
  '../mw/mw-misc.js', '../mw/mw-workers.js', '../mw/mw-geo.js',
  '../mw/mw-adblock.js', '../mw/mw-cleanup.js'
];

function load(src) {
  return new Promise(r => {
    const s = document.createElement('script');
    s.src = src + '?t=' + Date.now();
    s.onload = () => r(true);
    s.onerror = () => r(false);
    document.head.appendChild(s);
  });
}

function h32Float(arr) {
  // quantize to reduce pure FP noise sensitivity in hash
  let h = 2166136261 >>> 0;
  for (let i = 0; i < arr.length; i++) {
    const q = Math.round(arr[i] * 1e6);
    h ^= (q >>> 0);
    h = Math.imul(h, 16777619) >>> 0;
    h ^= (q < 0 ? 0x9e3779b9 : 0);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h.toString(16).padStart(8, '0');
}

function sumAbs(arr) {
  let s = 0;
  for (let i = 0; i < arr.length; i++) s += Math.abs(arr[i]);
  return s;
}

function maxAbsDiff(a, b) {
  let m = 0;
  const n = Math.min(a.length, b.length);
  for (let i = 0; i < n; i++) {
    const d = Math.abs(a[i] - b[i]);
    if (d > m) m = d;
  }
  return m;
}

function meanAbsDiff(a, b) {
  let s = 0;
  const n = Math.min(a.length, b.length);
  for (let i = 0; i < n; i++) s += Math.abs(a[i] - b[i]);
  return n ? s / n : 0;
}

/** Classic fingerprint-style offline render */
async function renderOffline(sampleRate, length, channels) {
  const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new AC(channels, length, sampleRate);

  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.value = 10000;

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -50;
  comp.knee.value = 40;
  comp.ratio.value = 12;
  comp.attack.value = 0;
  comp.release.value = 0.25;

  osc.connect(comp);
  comp.connect(ctx.destination);
  osc.start(0);

  const buffer = await ctx.startRendering();
  return buffer;
}

function channelCopy(buffer, ch) {
  const src = buffer.getChannelData(ch);
  return new Float32Array(src);
}

const results = [];
const logs = [];

function add(name, pass, detail, skipped) {
  results.push({ name, pass, detail, skipped: !!skipped });
  logs.push((skipped ? 'SKIP  ' : pass ? 'PASS  ' : 'FAIL  ') + name + (detail ? '  —  ' + detail : ''));
}

(async () => {
  for (const f of ORDER) await load(f);
  // WASM audio may need a moment
  await new Promise(r => setTimeout(r, 120));

  const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!AC) {
    add('OfflineAudioContext', false, 'not available');
    finish();
    return;
  }
  add('OfflineAudioContext', true, 'available');

  const SR = 44100;
  const LEN = 5000;
  const CH = 1;

  // -------------------------------------------------------
  // 1. First render
  // -------------------------------------------------------
  let buf1, ch1;
  try {
    buf1 = await renderOffline(SR, LEN, CH);
    ch1 = channelCopy(buf1, 0);
    add('Render #1', true, `hash ${h32Float(ch1)}  sumAbs=${sumAbs(ch1).toFixed(4)}`);
  } catch (e) {
    add('Render #1', false, e.message);
    finish();
    return;
  }

  // -------------------------------------------------------
  // 2. Second identical render — must be stable (same noise)
  // -------------------------------------------------------
  let buf2, ch2;
  try {
    buf2 = await renderOffline(SR, LEN, CH);
    ch2 = channelCopy(buf2, 0);
    const maxD = maxAbsDiff(ch1, ch2);
    const meanD = meanAbsDiff(ch1, ch2);
    const sameHash = h32Float(ch1) === h32Float(ch2);
    // Allow tiny FP drift from audio engine; noise itself must be deterministic
    const stable = sameHash || maxD < 1e-7;
    add(
      'Render #2 stable vs #1',
      stable,
      stable
        ? `hash ${h32Float(ch2)} identical`
        : `maxDiff=${maxD} meanDiff=${meanD} hash ${h32Float(ch2)}`
    );
  } catch (e) {
    add('Render #2 stable vs #1', false, e.message);
  }

  // -------------------------------------------------------
  // 3. getChannelData repeated on same buffer — no double noise
  // -------------------------------------------------------
  const again = channelCopy(buf1, 0);
  const maxD2 = maxAbsDiff(ch1, again);
  add(
    'getChannelData no double-noise',
    maxD2 < 1e-12,
    maxD2 < 1e-12 ? 'identical' : 'maxDiff=' + maxD2
  );

  // -------------------------------------------------------
  // 4. Noise amplitude is small (scale ~0.003)
  // Compare structure: samples should stay in ~[-1,1], max |sample| reasonable
  // -------------------------------------------------------
  let maxSamp = 0, clipped = 0;
  for (let i = 0; i < ch1.length; i++) {
    const a = Math.abs(ch1[i]);
    if (a > maxSamp) maxSamp = a;
    if (a > 1.0 + 1e-5) clipped++;
  }
  add(
    'Amplitude sane (mostly ≤ 1.0)',
    clipped === 0 && maxSamp <= 1.05,
    `max|sample|=${maxSamp.toFixed(6)} clipped=${clipped}`
  );

  // -------------------------------------------------------
  // 5. Noise is actually present
  // Two renders with different seeds would differ; here we check that
  // the buffer is not pure zeros / not a trivial constant.
  // Also: if we could render without extension we'd compare — instead
  // check variance and that sum is non-trivial.
  // -------------------------------------------------------
  let mean = 0;
  for (let i = 0; i < ch1.length; i++) mean += ch1[i];
  mean /= ch1.length;
  let variance = 0;
  for (let i = 0; i < ch1.length; i++) {
    const d = ch1[i] - mean;
    variance += d * d;
  }
  variance /= ch1.length;
  const hasSignal = variance > 1e-10 && sumAbs(ch1) > 0.01;
  add(
    'Signal present (variance / energy)',
    hasSignal,
    `variance=${variance.toExponential(3)} sumAbs=${sumAbs(ch1).toFixed(4)}`
  );

  // -------------------------------------------------------
  // 6. Stereo: both channels get noise, independently consistent
  // -------------------------------------------------------
  try {
    const stereo = await renderOffline(SR, 3000, 2);
    const L = channelCopy(stereo, 0);
    const R = channelCopy(stereo, 1);
    const l2 = channelCopy(stereo, 0);
    const sameL = maxAbsDiff(L, l2) < 1e-12;
    // L and R may differ (different content after compressor) — just check both non-empty
    const bothLive = sumAbs(L) > 0.001 && sumAbs(R) > 0.001;
    add(
      'Stereo channels readable & stable',
      sameL && bothLive,
      `L hash ${h32Float(L)}  R hash ${h32Float(R)}`
    );
  } catch (e) {
    add('Stereo channels readable & stable', false, e.message);
  }

  // -------------------------------------------------------
  // 7. oncomplete path (event-based) also noised
  // -------------------------------------------------------
  try {
    const ctx = new AC(1, 2000, SR);
    const osc = ctx.createOscillator();
    osc.frequency.value = 440;
    osc.connect(ctx.destination);
    osc.start(0);

    const viaEvent = await new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error('oncomplete timeout')), 3000);
      ctx.oncomplete = (ev) => {
        clearTimeout(t);
        resolve(ev.renderedBuffer);
      };
      ctx.startRendering().catch(() => {});
    });
    const evCh = channelCopy(viaEvent, 0);
    add(
      'oncomplete path produces buffer',
      evCh.length === 2000 && sumAbs(evCh) > 0,
      `len=${evCh.length} hash ${h32Float(evCh)}`
    );
  } catch (e) {
    add('oncomplete path produces buffer', false, e.message);
  }

  // -------------------------------------------------------
  // 8. AnalyserNode getFloatFrequencyData stability
  // -------------------------------------------------------
  if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const actx = new Ctx();
      const osc = actx.createOscillator();
      osc.frequency.value = 1000;
      const analyser = actx.createAnalyser();
      analyser.fftSize = 256;
      osc.connect(analyser);
      analyser.connect(actx.destination);
      osc.start();

      // resume may be needed
      if (actx.state === 'suspended') await actx.resume();
      await new Promise(r => setTimeout(r, 80));

      const a1 = new Float32Array(analyser.frequencyBinCount);
      const a2 = new Float32Array(analyser.frequencyBinCount);
      analyser.getFloatFrequencyData(a1);
      analyser.getFloatFrequencyData(a2);

      // Live audio changes; we only check that calls succeed and return finite data
      let finite = true;
      for (let i = 0; i < a1.length; i++) if (!Number.isFinite(a1[i])) finite = false;

      osc.stop();
      await actx.close();

      add(
        'Analyser getFloatFrequencyData works',
        finite && a1.length > 0,
        finite ? `bins=${a1.length} sample[0]=${a1[0].toFixed(2)}` : 'non-finite values'
      );
    } catch (e) {
      add('Analyser getFloatFrequencyData works', false, e.message);
    }
  } else {
    add('Analyser getFloatFrequencyData works', true, 'AudioContext missing', true);
  }

  // -------------------------------------------------------
  // 9. Analyser getByteTimeDomainData works
  // -------------------------------------------------------
  if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const actx = new Ctx();
      const osc = actx.createOscillator();
      const analyser = actx.createAnalyser();
      analyser.fftSize = 2048;
      osc.connect(analyser);
      osc.start();
      if (actx.state === 'suspended') await actx.resume();
      await new Promise(r => setTimeout(r, 50));

      const b1 = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(b1);
      let mid = 0;
      for (let i = 0; i < b1.length; i++) mid += b1[i];
      mid /= b1.length;

      osc.stop();
      await actx.close();

      add(
        'Analyser getByteTimeDomainData works',
        b1.length > 0,
        `len=${b1.length} mean=${mid.toFixed(1)}`
      );
    } catch (e) {
      add('Analyser getByteTimeDomainData works', false, e.message);
    }
  } else {
    add('Analyser getByteTimeDomainData works', true, 'skipped', true);
  }

  // -------------------------------------------------------
  // 10. Different length still works (no crash / empty)
  // -------------------------------------------------------
  try {
    const short = await renderOffline(SR, 128, 1);
    const long = await renderOffline(SR, 8000, 1);
    add(
      'Variable buffer lengths',
      short.length === 128 && long.length === 8000,
      `short=${short.length} long=${long.length}`
    );
  } catch (e) {
    add('Variable buffer lengths', false, e.message);
  }

  finish();

  function finish() {
    const active = results.filter(r => !r.skipped);
    const passed = active.filter(r => r.pass).length;
    const total = active.length;
    const allOk = passed === total;

    const sumEl = document.getElementById('sum');
    sumEl.textContent = allOk
      ? `ALL ${total} CHECKS PASSED` + (results.some(r => r.skipped) ? ` (${results.filter(r => r.skipped).length} skipped)` : '')
      : `${passed}/${total} passed — ${total - passed} FAILED`;
    sumEl.className = allOk ? 'green' : 'red';

    const tbody = document.querySelector('#t tbody');
    for (const r of results) {
      const tr = document.createElement('tr');
      const cls = r.skipped ? 'skip' : (r.pass ? 'ok' : 'bad');
      tr.innerHTML =
        `<td>${r.name}</td>` +
        `<td class="${cls}">${r.skipped ? 'SKIP' : r.pass ? 'PASS' : 'FAIL'}</td>` +
        `<td>${r.detail || ''}</td>`;
      tbody.appendChild(tr);
    }
    document.getElementById('log').textContent = logs.join('\n');
  }
})();
</script>
</body>
</html>
