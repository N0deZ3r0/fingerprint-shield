<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>hideAdBlocker — what it actually masks</title></head>
<body><pre id="out">running…</pre>
<script>
// Does the hideAdBlocker module defeat the checks sites really run?
//
// The module (mw/mw-adblock.js) rewrites getComputedStyle and getBoundingClientRect for
// elements whose id/class looks like ad bait. This page asks whether that is the SET of
// reads a detector uses — an ad-bait probe has several ways to notice a hidden element and
// only needs ONE of them to answer.
//
// The bait is hidden the way a blocker hides it: a cosmetic filter, i.e. a stylesheet rule
// setting display:none. That is what uBlock/AdBlock do; they do not remove the node.
const FIXTURE = {
  mode:'normal', screenWidth:1920, screenHeight:1080, colorDepth:24, devicePixelRatio:1,
  platform:'Win32', hwConcurrency:8, deviceMemory:8, vendor:'Google Inc.',
  language:'en-US', locale:'en-US', countryCode:'US', languages:['en-US','en'],
  timezone:'America/New_York', noiseSeed:305419896, maxTouchPoints:0,
  userAgent:navigator.userAgent, appVersion:'5.0 (Windows NT 10.0; Win64; x64)',
  webglVendor:'Google Inc. (Intel)', webglRenderer:'ANGLE (Intel, Iris Xe)', webglParams:{},
  allowedFonts:['Arial'], mediaDevices:[], plugins:[], mimeTypes:[],
  features:{canvas:true,webgl:true,webrtc:true,navigator:true,screen:true,timezone:true,
    geolocation:true,battery:true,fonts:true,clientRects:false,plugins:true,network:true,
    hideAdBlocker:true}
};
sessionStorage.setItem('v.ui.s', JSON.stringify(FIXTURE));
sessionStorage.setItem('v.ui.m', 'normal');

// The cosmetic filter, applied before the modules load.
const css = document.createElement('style');
css.textContent = '.adsbox, #ad-banner, .sponsored { display: none !important; }';
document.head.appendChild(css);

const MODULES = ['../profile-injector.js','../mw/mw-bag.js','../mw/mw-core.js','../mw/mw-timezone-screen.js',
  '../mw/mw-navigator.js','../mw/mw-canvas-audio.js','../mw/mw-misc.js','../mw/mw-workers.js',
  '../mw/mw-geo.js','../mw/mw-adblock.js','../mw/mw-cleanup.js'];
const load = (s) => new Promise((r) => {
  const e = document.createElement('script'); e.src = s + '?x=' + Date.now();
  e.onload = e.onerror = r; document.head.appendChild(e);
});

(async () => {
  const L = [];
  for (const m of MODULES) await load(m);

  const bait = document.createElement('div');
  bait.className = 'adsbox';
  bait.innerHTML = '&nbsp;';
  bait.style.cssText = 'width:300px;height:250px;position:absolute;left:-9999px;top:-9999px';
  document.body.appendChild(bait);

  // Every way a detector can ask "was my bait hidden". Each returns TRUE when it has
  // noticed the block — i.e. true means the mask FAILED for that read.
  const CHECKS = {
    'getComputedStyle().display === "none"': () => getComputedStyle(bait).display === 'none',
    'getComputedStyle().visibility hidden':  () => getComputedStyle(bait).visibility === 'hidden',
    'getPropertyValue("display") === "none"':() => getComputedStyle(bait).getPropertyValue('display') === 'none',
    'getBoundingClientRect().height === 0':  () => bait.getBoundingClientRect().height === 0,
    'offsetHeight === 0':                    () => bait.offsetHeight === 0,
    'offsetWidth === 0':                     () => bait.offsetWidth === 0,
    'clientHeight === 0':                    () => bait.clientHeight === 0,
    'offsetParent === null':                 () => bait.offsetParent === null,
    'getClientRects().length === 0':         () => bait.getClientRects().length === 0,
    'checkVisibility() === false':           () => (typeof bait.checkVisibility === 'function')
                                                     ? bait.checkVisibility() === false : null,
    'window.adblock is defined':             () => window.adblock !== undefined,
    'window.fuckAdBlock is defined':         () => window.fuckAdBlock !== undefined
  };

  let caught = 0, total = 0;
  L.push('bait: <div class="adsbox">, hidden by a cosmetic filter (display:none !important)');
  L.push('');
  L.push('  a check that DETECTS the block is a hole in the mask:');
  L.push('');
  for (const [name, fn] of Object.entries(CHECKS)) {
    let v; try { v = fn(); } catch (e) { v = 'ERR ' + e.message; }
    if (v === null) { L.push('  n/a    ' + name); continue; }
    total++;
    if (v === true) { caught++; L.push('  LEAK   ' + name.padEnd(42) + '-> block is visible'); }
    else            { L.push('  masked ' + name.padEnd(42) + '-> ' + v); }
  }

  // [FIX dom-clobbering-turned-a-read-into-a-throw] The mask sits in FRONT of five APIs
  // every page uses — getComputedStyle, getBoundingClientRect, getClientRects,
  // checkVisibility and the offset getters — and each one first asks isBait(el). A
  // <form> whose controls are NAMED after element properties shadows them
  // (HTMLFormElement's named getter is [LegacyOverrideBuiltIns]), so el.id came back as an
  // <input> and .toLowerCase() threw INTO THE PAGE. Reported from
  // github.com/<user>/<repo>/settings, which has exactly that form:
  //
  //   Uncaught TypeError: (el.id || "").toLowerCase is not a function
  //
  // That is not a leak, it is the extension breaking a site. Every read below must come
  // back with a value; a throw is the failure.
  const clob = document.createElement('form');
  clob.innerHTML = '<input name="id"><input name="className"><input name="tagName">' +
                   '<input name="getAttribute"><input name="checkVisibility">';
  clob.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:40px;height:20px';
  document.body.appendChild(clob);
  const SAFE = {
    'getComputedStyle(form).display':      () => getComputedStyle(clob).display,
    'form.getBoundingClientRect().width':  () => clob.getBoundingClientRect().width,
    'form.getClientRects().length':        () => clob.getClientRects().length,
    'form.offsetHeight':                   () => clob.offsetHeight,
    'form.checkVisibility()':              () => (typeof Element.prototype.checkVisibility === 'function')
                                                   ? Element.prototype.checkVisibility.call(clob) : null
  };
  let threw = 0;
  L.push('');
  L.push('DOM clobbering: a <form> with controls named id/className/tagName/getAttribute');
  L.push('  (the shape github.com/…/settings has — every read must RETURN, not throw)');
  L.push('');
  for (const [name, fn] of Object.entries(SAFE)) {
    let v, bad = false;
    try { v = fn(); } catch (e) { v = 'THREW ' + e.name + ': ' + e.message; bad = true; threw++; }
    L.push((bad ? '  THROWS ' : '  ok     ') + name.padEnd(38) + '-> ' + v);
  }

  L.push('');
  L.push('masked ' + (total - caught) + ' of ' + total + ' reads, ' + threw + ' clobbered read(s) threw');
  L.push('');
  L.push('FAILURES: ' + (caught + threw));
  document.getElementById('out').textContent = L.join('\n');
})();
</script>
</body></html>
