<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>runtime smoke</title></head>
<body><pre id="out">running…</pre>
<script>
// Seed a profile exactly the way background.injectProfile does, then load the
// MAIN-world modules in manifest order and assert the patches took effect.
const PROFILE = {
  mode: 'normal',
  features: { canvas:true, audio:true, webgl:true, webrtc:true, navigator:true, screen:true,
    timezone:true, geolocation:true, battery:true, fonts:true, clientRects:true,
    plugins:true, network:true, hideAdBlocker:true },
  screenWidth: 2560, screenHeight: 1440, colorDepth: 32, devicePixelRatio: 1,
  platform: 'Win32', hwConcurrency: 12, deviceMemory: 32, webdriver: false, vendor: 'Google Inc.',
  language: 'et-EE', locale: 'et-EE', countryCode: 'EE', languages: ['et-EE','et','en','en-US'],
  doNotTrack: null, maxTouchPoints: 0, pdfViewerEnabled: true, hasBluetooth: false,
  profileId: 'pc_gaming', noiseSeed: 305419896, timezone: 'Europe/Tallinn',
  userAgent: navigator.userAgent.replace(/Chrome\/[\d.]+/, 'Chrome/151.0.0.0'),
  appVersion: '5.0 (Windows NT 10.0; Win64; x64)',
  webglVendor: 'Google Inc. (NVIDIA)',
  webglRenderer: 'ANGLE (NVIDIA, NVIDIA GeForce RTX 3060 Direct3D11 vs_5_0 ps_5_0)',
  webglParams: { 3379: 32768 },
  clientHints: { platform:'Windows', mobile:false, platformVersion:'10.0.0', architecture:'x86',
    bitness:'64', wow64:false, model:'', formFactors:['Desktop'] },
  mediaDevices: [], allowedFonts: ['Arial','Segoe UI','Tahoma'],
  plugins: [{ name:'PDF Viewer', filename:'internal-pdf-viewer', description:'Portable Document Format' }],
  mimeTypes: [{ type:'application/pdf', description:'Portable Document Format', suffixes:'pdf' },
              { type:'text/pdf', description:'Portable Document Format', suffixes:'pdf' }],
  speechVoices: [{ name:'Microsoft Kaia - Estonian', lang:'et-EE', localService:true, default:true }],
  webrtcProtected: true
};
sessionStorage.setItem('v.ui.s', JSON.stringify(PROFILE));
sessionStorage.setItem('v.ui.m', 'normal');
document.documentElement.setAttribute('data-v-tz', PROFILE.timezone);
document.documentElement.setAttribute('data-v-lc', PROFILE.locale);
document.documentElement.setAttribute('data-v-ns', String(PROFILE.noiseSeed));
document.documentElement.setAttribute('data-v-ft', JSON.stringify(PROFILE.features));

const ERRORS = [];
window.addEventListener('error', e => ERRORS.push('window.onerror: ' + e.message));

const ORDER = ['profile-injector.js','mw/mw-bag.js','mw/mw-core.js','mw/mw-timezone-screen.js',
  'mw/mw-navigator.js','mw/mw-canvas-audio.js','mw/mw-misc.js','mw/mw-workers.js',
  'mw/mw-geo.js','mw/mw-adblock.js'];   // mw-cleanup.js runs last, see below

// Capture natives BEFORE loading, so we can prove the patches replaced them.
const NATIVE = {
  gbcr: Element.prototype.getBoundingClientRect,
  gid: CanvasRenderingContext2D.prototype.getImageData,
  toDataURL: HTMLCanvasElement.prototype.toDataURL,
  getContext: HTMLCanvasElement.prototype.getContext,
  measureText: CanvasRenderingContext2D.prototype.measureText,
  tzOffset: Date.prototype.getTimezoneOffset,
  register: navigator.serviceWorker && navigator.serviceWorker.register,
  // Captured before the modules load: the PLUGINS section deliberately does nothing
  // when the browser already ships plugins ([FIX less-detect] in mw/mw-misc.js), so
  // this decides whether the enabledPlugin check below is testing our code or the
  // browser's. See the note at that check.
  pluginsLen: (function () { try { return navigator.plugins.length; } catch (e) { return 0; } })()
};

function load(src) {
  return new Promise(res => {
    const s = document.createElement('script');
    s.src = src + '?x=' + Date.now();
    s.onload = () => res(true);
    s.onerror = () => { ERRORS.push('load failed: ' + src); res(false); };
    document.head.appendChild(s);
  });
}

(async () => {
  const L = [];
  const t = (n, p, d) => L.push((p ? 'PASS  ' : 'FAIL  ') + n + (d ? '  ::  ' + d : ''));

  for (const f of ORDER) await load(f);
  t('all modules loaded without load/parse error', ERRORS.length === 0, ERRORS.join(' | '));
  t('mw-core published __AFP_MW__', !!window.__AFP_MW__);

  const MW = window.__AFP_MW__ || {};

  // --- timezone (mw-timezone-screen) ---
  t('Date.getTimezoneOffset patched', Date.prototype.getTimezoneOffset !== NATIVE.tzOffset);
  const janOff = new Date(Date.UTC(2026, 0, 15, 12)).getTimezoneOffset();
  const julOff = new Date(Date.UTC(2026, 6, 15, 12)).getTimezoneOffset();
  t('Europe/Tallinn winter offset = -120 (EET)', janOff === -120, String(janOff));
  t('Europe/Tallinn summer offset = -180 (EEST)', julOff === -180, String(julOff));
  t('Intl resolvedOptions().timeZone spoofed',
    new Intl.DateTimeFormat().resolvedOptions().timeZone === 'Europe/Tallinn',
    new Intl.DateTimeFormat().resolvedOptions().timeZone);
  t('new Date() instanceof Date still true (ctor proxy intact)', new Date() instanceof Date);
  t('Intl.NumberFormat locale spoofed',
    new Intl.NumberFormat().resolvedOptions().locale === 'et-EE',
    new Intl.NumberFormat().resolvedOptions().locale);

  // --- DST boundary (the sign-fix that America/* relies on) ---
  // [FIX profile-readable-by-any-page] Swapping the profile mid-test used to be a
  // sessionStorage write. There is nothing in the page to write to now — the modules
  // read a closure — so this goes through the same channel background.js uses on
  // tabs.onUpdated: a `ui:state` CustomEvent. That makes this the live-swap test as
  // well: if the ui:state listener in mw-core ever stops updating, this goes red.
  const setProfile = (p) => document.dispatchEvent(new CustomEvent('ui:state', { detail: p }));
  setProfile(Object.assign({}, PROFILE, { timezone: 'America/New_York' }));
  const before = new Date(Date.UTC(2026, 2, 8, 6, 59)).getTimezoneOffset();
  const after  = new Date(Date.UTC(2026, 2, 8, 7,  1)).getTimezoneOffset();
  t('America/New_York DST flips at 07:00 UTC 2026-03-08 (300→240)',
    before === 300 && after === 240, before + ' → ' + after);
  setProfile(PROFILE);

  // --- navigator ---
  t('hardwareConcurrency spoofed', navigator.hardwareConcurrency === 12, String(navigator.hardwareConcurrency));
  t('deviceMemory spoofed', navigator.deviceMemory === 32, String(navigator.deviceMemory));
  t('navigator.language spoofed', navigator.language === 'et-EE', navigator.language);

  // --- the fixed onchange getter name ---
  if (navigator.connection) {
    // [FIX instance-own-property-lies] Read this off the PROTOTYPE, which is where the
    // native accessor lives — verified in stock Chromium: onchange is an own property of
    // NetworkInformation.prototype (getter named 'get onchange') and NOT of the
    // connection object. This check used to read the instance, which passed only because
    // the patch was landing in the wrong place: an own 'onchange' on the instance is one
    // of the own-property lies dev-ownprops.html now diffs against a clean realm.
    const NIP = Object.getPrototypeOf(navigator.connection);
    const d = Object.getOwnPropertyDescriptor(NIP, 'onchange');
    t('connection.onchange is on the prototype, not the instance',
      !Object.getOwnPropertyDescriptor(navigator.connection, 'onchange') && !!d,
      'instance own=' + !!Object.getOwnPropertyDescriptor(navigator.connection, 'onchange'));
    const nm = d && d.get ? d.get.name : '(no getter)';
    const ts = d && d.get ? String(d.get) : '';
    t('connection.onchange getter named like native accessor (get onchange)',
      nm === 'get onchange', 'name=' + nm);
    t('connection.onchange getter toString looks native',
      /\[native code\]/.test(ts) && !/getLayoutMap/.test(ts), ts);
  } else { L.push('SKIP  navigator.connection absent'); }

  // --- the fixed enabledPlugin (real module, real navigator.mimeTypes) ---
  // This asserts something about OUR MimeTypeArray, so it is only meaningful when we
  // actually built one. The module bows out whenever the browser already reports
  // plugins, and then mimeTypes[0] is the browser's own object — whose enabledPlugin
  // is a real Plugin in headed Chrome but null in headless Chromium, which is what
  // made this check fail under test/run.mjs while passing when opened by hand. That
  // was the harness disagreeing with itself about which browser it was testing, not a
  // defect in the extension.
  try {
    if (NATIVE.pluginsLen > 0) {
      L.push('SKIP  native plugins present (' + NATIVE.pluginsLen +
        ') → PLUGINS module skipped by design, mimeTypes[0] is the browser\'s own');
    } else {
      const mt = navigator.mimeTypes && navigator.mimeTypes[0];
      if (mt) {
        const ep = mt.enabledPlugin;
        t('navigator.mimeTypes[0].enabledPlugin is a Plugin, not a function',
          typeof ep !== 'function' && !!ep && typeof ep.name === 'string',
          'typeof=' + typeof ep + ' name=' + (ep && ep.name));
      } else { L.push('SKIP  navigator.mimeTypes empty'); }
    }
  } catch (e) { t('enabledPlugin read', false, e.message); }

  // --- canvas: the size-gate fix. Same pixel, read 1x1 vs in a block. ---
  t('getImageData patched', CanvasRenderingContext2D.prototype.getImageData !== NATIVE.gid);
  t('toDataURL patched', HTMLCanvasElement.prototype.toDataURL !== NATIVE.toDataURL);
  t('getContext patched name/length',
    HTMLCanvasElement.prototype.getContext.name === 'getContext' &&
    HTMLCanvasElement.prototype.getContext.length === 1,
    'name=' + HTMLCanvasElement.prototype.getContext.name +
    ' length=' + HTMLCanvasElement.prototype.getContext.length);

  const cv = document.createElement('canvas');
  cv.width = 300; cv.height = 150;
  const cx = cv.getContext('2d');
  // non-flat content so the flat-region restore does not undo the noise
  const grd = cx.createLinearGradient(0, 0, 300, 150);
  grd.addColorStop(0, '#123456'); grd.addColorStop(1, '#abcdef');
  cx.fillStyle = grd; cx.fillRect(0, 0, 300, 150);
  cx.fillStyle = '#f00'; cx.font = '20px Arial'; cx.fillText('Fingerprint 42', 10, 60);

  let mism = [], compared = 0;
  const block = cx.getImageData(0, 0, 300, 150);
  for (let y = 20; y < 80; y += 7) {
    for (let x = 5; x < 200; x += 11) {
      const one = cx.getImageData(x, y, 1, 1);
      const bi = (y * 300 + x) * 4;
      compared++;
      for (let c = 0; c < 3; c++) {
        if (one.data[c] !== block.data[bi + c]) { mism.push(x + ',' + y + ' ch' + c + ': ' + one.data[c] + ' vs ' + block.data[bi + c]); }
      }
    }
  }
  t('1x1 read == block read for same pixel (CheckIntegrity invariant, ' + compared + ' pixels)',
    mism.length === 0, mism.slice(0, 6).join(' | ') + (mism.length > 6 ? ' …+' + (mism.length - 6) : ''));

  // deterministic re-read
  const again = cx.getImageData(0, 0, 300, 150);
  let drift = 0;
  for (let i = 0; i < block.data.length; i++) if (block.data[i] !== again.data[i]) drift++;
  t('repeated identical read is byte-stable', drift === 0, drift + ' differing bytes');

  // tiny canvas must stay untouched
  const tiny = document.createElement('canvas');
  tiny.width = 16; tiny.height = 16;
  const tcx = tiny.getContext('2d');
  tcx.fillStyle = '#0f0'; tcx.fillRect(0, 0, 16, 16);
  const tpx = tcx.getImageData(0, 0, 16, 16);
  t('16x16 canvas left unnoised (pure green)',
    tpx.data[0] === 0 && tpx.data[1] === 255 && tpx.data[2] === 0,
    [tpx.data[0], tpx.data[1], tpx.data[2]].join(','));

  // --- measureText still returns usable numbers ---
  const m = cx.measureText('Fingerprint 42');
  t('measureText returns finite width', typeof m.width === 'number' && isFinite(m.width) && m.width > 0, String(m.width));

  // --- DOMRect invariants (clientRects enabled in this profile) ---
  const el = document.getElementById('out');
  const r = el.getBoundingClientRect();
  t('getBoundingClientRect patched', Element.prototype.getBoundingClientRect !== NATIVE.gbcr);
  t('DOMRect invariant x===left && y===top', r.x === r.left && r.y === r.top, r.x + '/' + r.left);
  t('DOMRect invariant right-left===width', (r.right - r.left) === r.width, (r.right - r.left) + ' vs ' + r.width);
  t('DOMRect invariant bottom-top===height', (r.bottom - r.top) === r.height, (r.bottom - r.top) + ' vs ' + r.height);

  // ===== NEW: TextMetrics identity =====
  const tm = cx.measureText('Fingerprint 42');
  if (typeof TextMetrics !== 'undefined') {
    t('measureText result instanceof TextMetrics', tm instanceof TextMetrics, 'ctor=' + (tm.constructor && tm.constructor.name));
    t('measureText result has NO own properties (matches native)',
      JSON.stringify(Object.getOwnPropertyNames(tm)) === '[]',
      JSON.stringify(Object.getOwnPropertyNames(tm)));
    const baselines = ['hangingBaseline','alphabeticBaseline','ideographicBaseline']
      .filter(k => k in TextMetrics.prototype);
    const bad = baselines.filter(k => typeof tm[k] !== 'number');
    t('baseline metrics are numbers, not undefined (' + baselines.join(',') + ')',
      baselines.length > 0 && bad.length === 0, bad.length ? 'non-numeric: ' + bad.join(',') : 'all numeric');
    const d = Object.getOwnPropertyDescriptor(TextMetrics.prototype, 'width');
    t('TextMetrics.prototype.width is a native-looking accessor named width',
      !!d && !!d.get && d.get.name === 'get width' && /\[native code\]/.test(String(d.get)),
      d && d.get ? String(d.get) : 'no getter');
    t('TextMetrics accessor still throws Illegal invocation on a foreign this',
      (() => { try { d.get.call({}); return false; } catch (e) { return /Illegal invocation/.test(e.message); } })());
    t('width is substituted (finite, close to but not equal to raw)',
      isFinite(tm.width) && tm.width > 0, String(tm.width));
    // an UNTOUCHED TextMetrics must still report native values, not ours
    const raw = NATIVE.measureText.call(cx, 'Fingerprint 42');
    t('TextMetrics not produced by our patch falls through to native width',
      isFinite(raw.width) && raw.width > 0 && raw.width !== tm.width,
      'native=' + raw.width + ' patched=' + tm.width);
  }
  // OffscreenCanvas 2D must agree with HTMLCanvas 2D (was unpatched before)
  if (typeof OffscreenCanvas !== 'undefined') {
    const oc = new OffscreenCanvas(300, 150);
    const ocx = oc.getContext('2d');
    ocx.font = cx.font = '20px Arial';
    const a = cx.measureText('Fingerprint 42').width;
    const b = ocx.measureText('Fingerprint 42').width;
    t('OffscreenCanvas measureText width == HTMLCanvas measureText width', a === b, a + ' vs ' + b);
    t('OffscreenCanvas measureText/fillText/strokeText are masked',
      ocx.measureText.name === 'measureText' && /\[native code\]/.test(String(ocx.measureText)) &&
      /\[native code\]/.test(String(ocx.fillText)) && /\[native code\]/.test(String(ocx.strokeText)));
  }

  const glc = document.createElement('canvas').getContext('webgl');

  // ===== NEW: GHEV re-wrap guard actually blocks (was unbounded nesting) =====
  if (navigator.userAgentData) {
    const first = navigator.userAgentData.getHighEntropyValues;
    const brandsBefore = JSON.stringify(navigator.userAgentData.brands);
    for (let i = 0; i < 40; i++) void navigator.userAgentData;   // 40 re-entries of _patchUAD
    const later = navigator.userAgentData.getHighEntropyValues;
    t('getHighEntropyValues identity stable across 40 userAgentData accesses (no re-wrap)',
      first === later, first === later ? 'same fn' : 'RE-WRAPPED');
    const hev = await navigator.userAgentData.getHighEntropyValues(['platform','platformVersion','architecture','bitness','fullVersionList']);
    t('platformVersion locked to 10.0.0 after 40 re-entries', hev.platformVersion === '10.0.0', hev.platformVersion);
    // [FIX ua-ch-brand-added-to-three-sources-of-four] This used to assert the snapshot
    // contained "Google Chrome" + "Chromium", which encoded the old contract: the brand
    // list was rebuilt with those two appended whether or not the browser had them. That
    // append is gone — it disagreed with the sec-ch-ua-full-version-list header, which is
    // left native, and a server reads the disagreement as tampering.
    //
    // What this check is actually for is the re-wrap guard above: the brands must survive
    // 40 re-entries of _patchUAD intact. So it compares against the snapshot taken before
    // the loop rather than against a brand set. That is the stronger statement anyway —
    // it fails on ANY corruption, not just a missing Chrome brand — and it holds in
    // headless, where the native brand is HeadlessChrome and no Google Chrome exists.
    t('brands snapshot unchanged across 40 re-entries',
      JSON.stringify(navigator.userAgentData.brands) === brandsBefore,
      JSON.stringify(navigator.userAgentData.brands));
  }

  // ===== GL context instance-wrap guard via WeakSet =====
  // [FIX g0-deleted-before-it-was-ever-called] The per-context wrap used to be published
  // as window.__g0 and this check was gated on `typeof window.__g0 === 'function'`. Once
  // the wrap moved onto __AFP_MW__ that gate went permanently false, so the check stopped
  // running and reported nothing — a skipped check that looks exactly like a passing one,
  // which is the failure mode this whole suite exists to avoid. Asserted, not gated, so
  // the day the wrap goes missing again this says so out loud.
  // Read before mw-cleanup.js is loaded further down: it deletes __AFP_MW__.
  const wrapGL = window.__AFP_MW__ && window.__AFP_MW__.wrapGL;
  t('__AFP_MW__.wrapGL is published (the per-context WebGL wrap)', typeof wrapGL === 'function',
    'typeof=' + typeof wrapGL);
  if (glc && typeof wrapGL === 'function') {
    const before = glc.getParameter;
    wrapGL(glc); wrapGL(glc); wrapGL(glc);
    t('wrapGL is idempotent (WeakSet guard) — getParameter not re-wrapped',
      glc.getParameter === before, glc.getParameter === before ? 'same fn' : 'RE-WRAPPED');
  } else {
    t('GL context available to exercise the wrap', !!glc, glc ? 'yes' : 'no webgl context');
  }

  // --- geolocation: masked + returns spoofed EE coords ---
  const gcp = navigator.geolocation.getCurrentPosition;
  t('getCurrentPosition masked as native',
    gcp.name === 'getCurrentPosition' && /\[native code\]/.test(String(gcp)) && gcp.length === 1,
    'name=' + gcp.name + ' length=' + gcp.length);
  const pos = await new Promise(res => { navigator.geolocation.getCurrentPosition(res); setTimeout(() => res(null), 800); });
  t('geolocation returns Tallinn-ish coords for EE',
    !!pos && Math.abs(pos.coords.latitude - 59.44) < 0.1 && Math.abs(pos.coords.longitude - 24.75) < 0.1,
    pos ? pos.coords.latitude.toFixed(3) + ',' + pos.coords.longitude.toFixed(3) : 'no position');

  // --- serviceWorker.register masked (mw-workers fix) ---
  if (NATIVE.register) {
    const reg = navigator.serviceWorker.register;
    t('serviceWorker.register masked as native',
      reg !== NATIVE.register && reg.name === 'register' && /\[native code\]/.test(String(reg)),
      'name=' + reg.name + ' str=' + String(reg).slice(0, 60));
    t('register own keys are only length+name',
      JSON.stringify(Object.getOwnPropertyNames(reg)) === '["length","name"]',
      JSON.stringify(Object.getOwnPropertyNames(reg)));
  } else { L.push('SKIP  serviceWorker absent'); }

  // --- speech voices: getters named, incl. reserved-word "default" ---
  if (window.speechSynthesis) {
    const vs = speechSynthesis.getVoices();
    if (vs && vs.length) {
      const v0 = vs[0];
      const dd = Object.getOwnPropertyDescriptor(v0, 'default');
      const nd = Object.getOwnPropertyDescriptor(v0, 'name');
      t('voice "default" getter named like native (get default)', !!dd && dd.get.name === 'get default', dd ? dd.get.name : 'none');
      t('voice "name" getter named like native (get name)', !!nd && nd.get.name === 'get name', nd ? nd.get.name : 'none');
      t('voice values readable', v0.name === 'Microsoft Kaia - Estonian' && v0.default === true,
        v0.name + ' / default=' + v0.default);
    } else { L.push('SKIP  getVoices empty'); }
  }

  // --- document.fonts stubs are named ---
  try {
    const fe = document.fonts.forEach, fk = document.fonts.keys;
    t('document.fonts.forEach/keys stubs are named',
      fe.name === 'forEach' && fk.name === 'keys', fe.name + '/' + fk.name);
  } catch (e) { L.push('SKIP  document.fonts ' + e.message); }

  // --- finally: mw-cleanup must run without throwing and remove the bag ---
  await load('mw/mw-cleanup.js');
  t('mw-cleanup removed window.__AFP_MW__', typeof window.__AFP_MW__ === 'undefined');

  // ===== NEW: after cleanup, nothing /afp/i-named is reachable by the page =====
  // (__AFP_MW__ is intentionally removed by mw-cleanup, so this must run last.)
  const leakTargets = [
    ['window', window], ['navigator', navigator],
    ['navigator.userAgentData', navigator.userAgentData],
    ['navigator.connection', navigator.connection],
    ['navigator.geolocation', navigator.geolocation],
    ['FontFaceSet.prototype', (typeof FontFaceSet !== 'undefined') ? FontFaceSet.prototype : null],
    ['document.fonts', document.fonts],
    ['TextMetrics.prototype', (typeof TextMetrics !== 'undefined') ? TextMetrics.prototype : null],
    ['document.documentElement', document.documentElement]
  ];
  if (glc) leakTargets.push(['WebGLRenderingContext instance', glc]);
  if (navigator.mimeTypes && navigator.mimeTypes[0]) leakTargets.push(['navigator.mimeTypes[0]', navigator.mimeTypes[0]]);
  const leaks = [];
  for (const [label, obj] of leakTargets) {
    if (!obj) continue;
    let keys = [];
    try { keys = Object.getOwnPropertyNames(obj); } catch (e) { continue; }
    keys.filter(k => /afp/i.test(k) || k === '_tzFixed').forEach(k => leaks.push(label + '.' + k));
  }
  t('no /afp/i-named own properties on page-visible objects', leaks.length === 0, leaks.join(' | '));
  t('window._afpCanvasMode gone', !('_afpCanvasMode' in window));
  t('userAgentData has no own keys beyond native', navigator.userAgentData
    ? Object.keys(navigator.userAgentData).every(k => !/afp/i.test(k)) : true,
    navigator.userAgentData ? JSON.stringify(Object.keys(navigator.userAgentData)) : 'n/a');

  // ===== NEW: popup presets are self-consistent with background.enforceCoherence =====
  try {
    const [popSrc, bgSrc] = await Promise.all([
      fetch('popup.js?x=1').then(r => r.text()),
      fetch('background.js?x=1').then(r => r.text())
    ]);
    // pull PROFILES array literal
    const pm = popSrc.match(/const PROFILES = (\[[\s\S]*?\n\];)/);
    const PROFILES = pm ? new Function('return ' + pm[1].replace(/;$/, ''))() : null;
    // pull enforceCoherence source by brace matching
    const start = bgSrc.indexOf('function enforceCoherence');
    let ec = null;
    if (start !== -1) {
      let i = bgSrc.indexOf('{', start), depth = 0, end = -1;
      for (let j = i; j < bgSrc.length; j++) {
        if (bgSrc[j] === '{') depth++;
        else if (bgSrc[j] === '}') { depth--; if (depth === 0) { end = j + 1; break; } }
      }
      if (end !== -1) ec = new Function('return (' + bgSrc.slice(start, end) + ')')();
    }
    t('extracted PROFILES + enforceCoherence from source', !!PROFILES && typeof ec === 'function',
      (PROFILES ? PROFILES.length + ' profiles' : 'no PROFILES') + ', ec=' + typeof ec);

    if (PROFILES && typeof ec === 'function') {
      // guard against drift: popup must still declare exactly 5 warning rules
      const ruleCount = (popSrc.match(/msgs\.push\(/g) || []).length;
      t('popup renderWarnings still has 5 rules (mirror below stays valid)', ruleCount === 5, 'found ' + ruleCount);

      const warnFor = p => {
        const m = [];
        if (p.cores >= 12 && p.memory < 16) m.push('cores>=12 with <16GB');
        if (p.screenW >= 3840 && p.cores < 8) m.push('4K with <8 cores');
        if (p.memory > 8 && p.memory !== 16 && p.memory !== 32) m.push('deviceMemory not bucketed');
        if ((p.gpuKey === 'nvidia_3060' || p.gpuKey === 'nvidia_3070') && p.memory < 16) m.push('NVIDIA with <16GB');
        if (p.gpuKey === 'intel_uhd' && (p.cores >= 12 || p.memory >= 16)) m.push('UHD with high CPU/RAM');
        return m;
      };
      const bucket = mem => mem <= 2 ? 2 : mem <= 4 ? 4 : mem <= 8 ? 8 : mem <= 16 ? 16 : 32;

      const warned = [], rewritten = [], unbucketed = [];
      PROFILES.forEach(p => {
        // "This machine" claims nothing — no numbers to bucket, no row for enforceCoherence,
        // which never runs on it (background.js afpIsHostRecord). Shape only.
        if (p.host) {
          if (p.cores !== undefined || p.memory !== undefined || p.gpuKey !== undefined) {
            rewritten.push(p.id + ': the host row must carry no hardware claim');
          }
          return;
        }
        const w = warnFor(p);
        if (w.length) warned.push(p.id + ': ' + w.join(', '));
        const before = { gpu: p.gpuKey, cores: p.cores, memory: p.memory, screenW: p.screenW, screenH: p.screenH };
        const after = ec({ gpu: p.gpuKey, cores: p.cores, memory: p.memory, screenW: p.screenW, screenH: p.screenH, platform: p.platform });
        if (after.gpu !== before.gpu || after.cores !== before.cores || after.memory !== before.memory ||
            after.screenW !== before.screenW || after.screenH !== before.screenH) {
          rewritten.push(p.id + ': ' + JSON.stringify(before) + ' → ' + JSON.stringify({gpu:after.gpu,cores:after.cores,memory:after.memory,screenW:after.screenW,screenH:after.screenH}));
        }
        if (bucket(p.memory) !== p.memory) unbucketed.push(p.id + ': declares ' + p.memory + ' but reports ' + bucket(p.memory));
        // spec label must state the same RAM the profile carries
        const specMem = (String(p.spec).match(/(\d+)GB/) || [])[1];
        if (specMem && Number(specMem) !== p.memory) unbucketed.push(p.id + ': spec says ' + specMem + 'GB but memory=' + p.memory);
      });
      t('no built-in profile trips its own coherence warning', warned.length === 0, warned.join(' | '));
      t('no built-in profile is silently rewritten by enforceCoherence', rewritten.length === 0, rewritten.join(' | '));
      t('declared memory == reported deviceMemory == spec label, for every profile',
        unbucketed.length === 0, unbucketed.join(' | '));
    }
  } catch (e) { t('popup/background profile consistency', false, e.message); }

  t('no uncaught errors across the whole run', ERRORS.length === 0, ERRORS.join(' | '));

  document.getElementById('out').textContent = L.join('\n') +
    '\n\nFAILURES: ' + L.filter(x => x.startsWith('FAIL')).length;
})();
</script>
</body></html>
