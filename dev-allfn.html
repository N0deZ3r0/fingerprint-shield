<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>exhaustive fn toString: window vs worker</title></head>
<body><pre id="out">running…</pre>
<script>
sessionStorage.setItem('v.ui.s', JSON.stringify({
  mode:'normal', screenWidth:1920, screenHeight:1080, colorDepth:32, devicePixelRatio:1,
  platform:'Win32', hwConcurrency:12, deviceMemory:32, vendor:'Google Inc.',
  language:'et-EE', locale:'et-EE', countryCode:'EE', languages:['et-EE','et','en','en-US'],
  timezone:'Europe/Tallinn', noiseSeed:305419896, maxTouchPoints:0,
  userAgent:navigator.userAgent.replace(/Chrome\/[\d.]+/,'Chrome/151.0.0.0'), appVersion:'5.0 (Windows NT 10.0; Win64; x64)',
  webglVendor:'Google Inc. (Intel)', webglRenderer:'ANGLE (Intel, Iris Xe)', webglParams:{},
  clientHints:{platform:'Windows',mobile:false,platformVersion:'10.0.0',architecture:'x86',bitness:'64',wow64:false,model:'',formFactors:['Desktop']},
  allowedFonts:['Arial','Segoe UI','Tahoma'], mediaDevices:[], plugins:[], mimeTypes:[],
  features:{canvas:true,audio:true,webgl:true,webrtc:true,navigator:true,screen:true,timezone:true,
    geolocation:true,battery:true,fonts:true,clientRects:true,plugins:true,network:true,hideAdBlocker:true}
}));
sessionStorage.setItem('v.ui.m','normal');

const ORDER=['profile-injector.js','mw/mw-bag.js','mw/mw-core.js','mw/mw-timezone-screen.js',
 'mw/mw-navigator.js','mw/mw-canvas-audio.js','mw/mw-misc.js','mw/mw-workers.js','mw/mw-geo.js','mw/mw-adblock.js'];
const load=(s)=>new Promise(r=>{const e=document.createElement('script');e.src=s+'?x='+Date.now();
  e.onload=()=>r(1);e.onerror=()=>r(0);document.head.appendChild(e);});

// Walk every interface that exists in BOTH scopes and record a signature for each
// function-valued own property (method or accessor) on the object and its prototype.
const SCAN = `
const NAMES = ['Object','Function','Array','String','Number','Boolean','Symbol','BigInt',
 'Math','JSON','Date','RegExp','Error','TypeError','RangeError','Promise','Map','Set',
 'WeakMap','WeakSet','WeakRef','Proxy','Reflect','ArrayBuffer','SharedArrayBuffer','DataView',
 'Int8Array','Uint8Array','Uint8ClampedArray','Int16Array','Uint16Array','Int32Array',
 'Uint32Array','Float32Array','Float64Array','BigInt64Array','BigUint64Array',
 'TextEncoder','TextDecoder','URL','URLSearchParams','Blob','File','FileReader',
 'Headers','Request','Response','fetch','WebSocket','XMLHttpRequest','EventTarget','Event',
 'MessageChannel','MessagePort','BroadcastChannel','AbortController','AbortSignal',
 'OffscreenCanvas','OffscreenCanvasRenderingContext2D','ImageData','ImageBitmap',
 'createImageBitmap','WebGLRenderingContext','WebGL2RenderingContext','WebGLShaderPrecisionFormat',
 'Performance','PerformanceEntry','Crypto','SubtleCrypto','CryptoKey',
 'NavigatorUAData','Notification','NetworkInformation','Intl','WebAssembly',
 'CompressionStream','ReadableStream','WritableStream','TransformStream',
 'CustomEvent','DOMException','structuredClone','queueMicrotask','atob','btoa',
 'setTimeout','setInterval','clearTimeout','clearInterval','isSecureContext','caches','indexedDB'];
function sigOf(f, acc){
  try {
    return (acc?'get ':'')+ (f.name||'') + '|' + f.length + '|' + String(f);
  } catch(e){ return 'ERR '+e.message; }
}
function collect(){
  const out = {};
  const add=(k,v)=>{ out[k]=v; };
  for (const nm of NAMES){
    let base;
    try { base = eval(nm); } catch(e){ continue; }
    if (base===undefined||base===null) continue;
    if (typeof base==='function') add(nm, sigOf(base,false));
    const targets = [[nm, base]];
    try { if (typeof base==='function' && base.prototype) targets.push([nm+'.prototype', base.prototype]); } catch(e){}
    for (const [label,obj] of targets){
      let keys=[];
      try { keys = Object.getOwnPropertyNames(obj).sort(); } catch(e){ continue; }
      for (const k of keys){
        if (k==='caller'||k==='arguments'||k==='callee') continue;
        let d=null;
        try { d = Object.getOwnPropertyDescriptor(obj,k); } catch(e){ continue; }
        if (!d) continue;
        if (typeof d.value==='function') add(label+'.'+k, sigOf(d.value,false));
        else if (typeof d.get==='function') add(label+'.'+k+' [get]', sigOf(d.get,true));
      }
    }
  }
  // navigator: WorkerNavigator vs Navigator differ by design, but the SHARED props matter
  const navProps=['hardwareConcurrency','deviceMemory','platform','userAgent','language',
    'languages','onLine','userAgentData','storage','permissions','locks','mediaCapabilities'];
  for (const p of navProps){
    let o=navigator,d=null;
    while(o&&!d){ try{ d=Object.getOwnPropertyDescriptor(o,p); }catch(e){break;} if(!d) o=Object.getPrototypeOf(o); }
    if (!d) continue;
    if (typeof d.value==='function') add('navigator.'+p, sigOf(d.value,false));
    else if (typeof d.get==='function') add('navigator.'+p+' [get]', sigOf(d.get,true));
  }
  return out;
}`;
eval(SCAN);
const WORKER_SRC = SCAN + `
onmessage=()=>{ try{ postMessage(collect()); }catch(e){ postMessage({__err:e.message}); } };`;

(async()=>{
  for(const f of ORDER) await load(f);
  const win = collect();
  const wk = await new Promise(r=>{
    try{
      const url=URL.createObjectURL(new Blob([WORKER_SRC],{type:'application/javascript'}));
      const w=new Worker(url);
      w.onmessage=e=>r(e.data); w.onerror=e=>r({__err:'worker error '+(e.message||'?')});
      w.postMessage(1); setTimeout(()=>r({__err:'timeout'}),20000);
    }catch(e){ r({__err:'spawn '+e.message}); }
  });
  const L=[];
  if (wk.__err){ L.push('FAIL worker scan: '+wk.__err);
    document.getElementById('out').textContent=L.join('\n'); return; }

  const winKeys=Object.keys(win), wkKeys=Object.keys(wk);
  const shared=winKeys.filter(k=>k in wk);
  const diffs=shared.filter(k=>win[k]!==wk[k]);
  const onlyWin=winKeys.filter(k=>!(k in wk));
  const onlyWk=wkKeys.filter(k=>!(k in win));

  L.push('scanned functions — window: '+winKeys.length+' , worker: '+wkKeys.length);
  L.push('present in BOTH scopes: '+shared.length);
  L.push('');
  L.push(diffs.length===0
    ? 'PASS  every shared function has an IDENTICAL signature (name|length|toString)'
    : 'FAIL  '+diffs.length+' shared functions differ:');
  diffs.slice(0,40).forEach(k=>L.push('   '+k+'\n      window = '+win[k].slice(0,120)+'\n      worker = '+wk[k].slice(0,120)));
  L.push('');
  L.push('— scope-exclusive (inherent, cannot be equalised) —');
  L.push('  only in window: '+onlyWin.length+(onlyWin.length?'  e.g. '+onlyWin.slice(0,8).join(', '):''));
  L.push('  only in worker: '+onlyWk.length+(onlyWk.length?'  e.g. '+onlyWk.slice(0,8).join(', '):''));
  document.getElementById('out').textContent=L.join('\n');
})();
</script>
</body></html>
